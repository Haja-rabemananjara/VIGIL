n    ws::{Broadcaster, WsEvent},\n};\n\npub const MESSAGE_MAX_LENGTH: usize = 2000;\n\n#[derive(Debug, Serialize)]\npub struct MessageResponse {\n    pub id: Uuid,\n    pub sender_id: Uuid,\n    pub recipient_id: Uuid,\n    pub content: String,\n    pub created_at: i64,\n}\n\nimpl MessageResponse {\n    fn from_row(row: repo::messages::MessageRow) -\u003e Self {\n        Self {\n            id: row.id,\n            sender_id: row.sender_id,\n            recipient_id: row.recipient_id,\n            content: row.content,\n            created_at: row.created_at.timestamp(),\n        }\n    }\n}\n\npub async fn send_message(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    sender_id: Uuid,\n    recipient_id: Uuid,\n    content: String,\n) -\u003e Result\u003cMessageResponse, AppError\u003e {\n    if sender_id == recipient_id {\n        return Err(AppError::Validation(\"cannot message yourself\".into()));\n    }\n\n    if content.trim().is_empty() {\n        return Err(AppError::Validation(\"content cannot be empty\".into()));\n    }\n    if content.len() \u003e MESSAGE_MAX_LENGTH {\n        return Err(AppError::Validation(format!(\n            \"content exceeds {MESSAGE_MAX_LENGTH} characters\"\n        )));\n    }\n\n    let shared = repo::messages::share_a_team(pool, sender_id, recipient_id).await?;\n    if !shared {\n        return Err(AppError::Forbidden(\n            \"you do not share a team with this user\".into(),\n        ));\n    }\n\n    let id = Uuid::new_v4();\n    let row = repo::messages::insert_message(pool, id, sender_id, recipient_id, \u0026content).await?;\n    let at = row.created_at.timestamp();\n\n    let event = WsEvent::PrivateMessageReceived {\n        from: sender_id,\n        to: recipient_id,\n        message_id: id,\n        content: content.clone(),\n        at,\n    };\n    broadcaster.to_user(sender_id, event.clone());\n    broadcaster.to_user(recipient_id, event);\n\n    Ok(MessageResponse::from_row(row))\n}\n\npub async fn get_conversation(\n    pool: \u0026PgPool,\n    caller_id: Uuid,\n    other_id: Uuid,\n    before_ts: Option\u003ci64\u003e,\n    limit: i64,\n) -\u003e Result\u003cVec\u003cMessageResponse\u003e, AppError\u003e {\n    let shared = repo::messages::share_a_team(pool, caller_id, other_id).await?;\n    if !shared {\n        return Err(AppError::Forbidden(\n            \"you do not share a team with this user\".into(),\n        ));\n    }\n\n    let before = before_ts\n        .map(|ts| chrono::DateTime::from_timestamp(ts, 0).unwrap_or_else(chrono::Utc::now));\n\n    let limit = limit.clamp(1, 100);\n\n    let rows = repo::messages::list_conversation(pool, caller_id, other_id, before, limit).await?;\n\n    Ok(rows.into_iter().map(MessageResponse::from_row).collect())\n}\n","traces":[{"line":23,"address":[14290385,14290160],"length":1,"stats":{"Line":0}},{"line":25,"address":[14290185],"length":1,"stats":{"Line":0}},{"line":26,"address":[14290194],"length":1,"stats":{"Line":0}},{"line":27,"address":[14290203],"length":1,"stats":{"Line":0}},{"line":28,"address":[14290212],"length":1,"stats":{"Line":0}},{"line":29,"address":[14290229],"length":1,"stats":{"Line":0}},{"line":34,"address":[14290064],"length":1,"stats":{"Line":0}},{"line":41,"address":[15708140,15708007],"length":1,"stats":{"Line":0}},{"line":42,"address":[15708175,15708958],"length":1,"stats":{"Line":0}},{"line":45,"address":[15708154,15708226],"length":1,"stats":{"Line":0}},{"line":46,"address":[15708298,15708811],"length":1,"stats":{"Line":0}},{"line":48,"address":[15708282,15708344],"length":1,"stats":{"Line":0}},{"line":49,"address":[15708539,15708419],"length":1,"stats":{"Line":0}},{"line":54,"address":[13958940],"length":1,"stats":{"Line":0}},{"line":55,"address":[15709539],"length":1,"stats":{"Line":0}},{"line":56,"address":[15709610],"length":1,"stats":{"Line":0}},{"line":57,"address":[15709543],"length":1,"stats":{"Line":0}},{"line":61,"address":[15709589],"length":1,"stats":{"Line":0}},{"line":62,"ad cUuid, HashMap\u003cString, Vec\u003cUuid\u003e\u003e\u003e,\n}\n\npub async fn get_reactions_for_incident(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cIncidentReactions, AppError\u003e {\n    let incident = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if incident.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let rows = repo::reactions::list_reactions_for_incident(pool, incident_id).await?;\n\n    let mut reactions: HashMap\u003cUuid, HashMap\u003cString, Vec\u003cUuid\u003e\u003e\u003e = HashMap::new();\n    for row in rows {\n        reactions\n            .entry(row.entry_id)\n            .or_default()\n            .entry(row.emoji)\n            .or_default()\n            .push(row.user_id);\n    }\n\n    Ok(IncidentReactions { reactions })\n}\n\npub async fn add_reaction(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    entry_id: Uuid,\n    user_id: Uuid,\n    emoji: String,\n) -\u003e Result\u003c(), AppError\u003e {\n    if !AVAILABLE_EMOJIS.contains(\u0026emoji.as_str()) {\n        return Err(AppError::Validation(format!(\"unknown emoji: {emoji}\")));\n    }\n\n    let entry = repo::incidents::find_timeline_entry(pool, entry_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"timeline entry not found\".into()))?;\n\n    let id = Uuid::new_v4();\n    repo::reactions::insert_reaction(pool, id, entry_id, user_id, \u0026emoji).await?;\n\n    let incident = repo::incidents::find_incident(pool, entry.incident_id)\n        .await?\n        .ok_or_else(|| AppError::Internal(\"parent incident not found\".into()))?;\n\n    broadcaster\n        .to_team(\n            incident.team_id,\n            WsEvent::ReactionAdded {\n                team_id: incident.team_id,\n                incident_id: entry.incident_id,\n                entry_id,\n                emoji,\n                user_id,\n            },\n        )\n        .await;\n\n    Ok(())\n}\n\npub async fn remove_reaction(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    entry_id: Uuid,\n    user_id: Uuid,\n    emoji: String,\n) -\u003e Result\u003c(), AppError\u003e {\n    let entry = repo::incidents::find_timeline_entry(pool, entry_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"timeline entry not found\".into()))?;\n\n    let deleted = repo::reactions::delete_reaction(pool, entry_id, user_id, \u0026emoji).await?;\n\n    if !deleted {\n        return Err(AppError::NotFound(\"reaction not found\".into()));\n    }\n\n    let incident = repo::incidents::find_incident(pool, entry.incident_id)\n        .await?\n        .ok_or_else(|| AppError::Internal(\"parent incident not found\".into()))?;\n\n    broadcaster\n        .to_team(\n            incident.team_id,\n            WsEvent::ReactionRemoved {\n                team_id: incident.team_id,\n                incident_id: entry.incident_id,\n                entry_id,\n                emoji,\n                user_id,\n            },\n        )\n        .await;\n\n    Ok(())\n}\n","traces":[{"line":24,"address":[14668272],"length":1,"stats":{"Line":0}},{"line":29,"address":[13168495,13167579,13167528,13167670,13167922,13168558,13167291,13167846,13167119],"length":1,"stats":{"Line":0}},{"line":30,"address":[13807647],"length":1,"stats":{"Line":0}},{"line":31,"address":[13169934,13167823,13169920,13167890],"length":1,"stats":{"Line":0}},{"line":33,"address":[13168066,13168143],"length":1,"stats":{"Line":0}},{"line":34,"address":[13168340,13168193],"length":1,"stats":{"Line":0}},{"line":37,"address":[13168571,13168282,13167206,13168154],"length":1,"stats":{"Line":0}},{"line":39,"address":[13169005],"length":1,"stats":{"Line":0}},{"line":40,"address":[13169053,13169843,13169153,13169280],"length":1,"stats":{"Line":0}},{"line":42,"address":[13169409],"length":1,"stat g\u003e,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let title = title.trim().to_string();\n    if title.is_empty() {\n        return Err(AppError::Validation(\"Title is required\".into()));\n    }\n    if title.len() \u003e 200 {\n        return Err(AppError::Validation(\n            \"Title must be 200 characters or fewer\".into(),\n        ));\n    }\n\n    if step_names.is_empty() {\n        return Err(AppError::Validation(\"At least one step is required\".into()));\n    }\n    if step_names.len() \u003e 20 {\n        return Err(AppError::Validation(\n            \"A release can have at most 20 steps\".into(),\n        ));\n    }\n\n    let step_names: Vec\u003cString\u003e = step_names\n        .into_iter()\n        .map(|s| s.trim().to_string())\n        .collect();\n\n    for name in \u0026step_names {\n        if name.is_empty() {\n            return Err(AppError::Validation(\"Step names must not be empty\".into()));\n        }\n        if name.len() \u003e 100 {\n            return Err(AppError::Validation(\n                \"Step names must be 100 characters or fewer\".into(),\n            ));\n        }\n    }\n\n    let mut seen = std::collections::HashSet::new();\n    for name in \u0026step_names {\n        if !seen.insert(name.to_lowercase()) {\n            return Err(AppError::Validation(format!(\n                \"Duplicate step name: '{name}'\"\n            )));\n        }\n    }\n\n    let release_id = Uuid::new_v4();\n\n    let row = releases::create_release(\n        pool,\n        release_id,\n        team_id,\n        \u0026title,\n        \u0026body,\n        created_by,\n        \u0026step_names,\n    )\n    .await\n    .map_err(|e| AppError::Internal(format!(\"Failed to create release: {e}\")))?;\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseStateChanged {\n                team_id,\n                release_id,\n                new_state: \"created\".to_string(),\n            },\n        )\n        .await;\n\n    build_full_response(pool, release_id, row).await\n}\n\npub async fn list_releases(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    status_filter: Option\u003cString\u003e,\n) -\u003e Result\u003cVec\u003cReleaseListItem\u003e, AppError\u003e {\n    if let Some(ref s) = status_filter {\n        let valid = [\n            \"created\",\n            \"in_progress\",\n            \"completed\",\n            \"cancelled\",\n            \"blocked\",\n        ];\n        if !valid.contains(\u0026s.as_str()) {\n            return Err(AppError::Validation(format!(\n                \"Invalid status filter: '{s}'. Must be one of: {valid:?}\"\n            )));\n        }\n    }\n\n    let releases = releases::list_releases(pool, team_id, status_filter.as_deref())\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to list releases: {e}\")))?;\n\n    if releases.is_empty() {\n        return Ok(vec![]);\n    }\n\n    let release_ids: Vec\u003cUuid\u003e = releases.iter().map(|r| r.id).collect();\n    let all_steps = releases::get_steps_for_releases(pool, \u0026release_ids)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    let mut steps_by_release: HashMap\u003cUuid, Vec\u003cReleaseStepRow\u003e\u003e = HashMap::new();\n    for step in all_steps {\n        steps_by_release\n            .entry(step.release_id)\n            .or_default()\n            .push(step);\n    }\n\n    let items = releases\n        .into_iter()\n        .map(|r| {\n            let steps = steps_by_release\n                .get(\u0026r.id)\n                .map(|s| s.as_slice())\n                .unwrap_or(\u0026[]);\n            ReleaseListItem::from_row(r, steps)\n        })\n        .collect();\n\n    Ok(items)\n}\n\npub async fn get_release(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let row = get_release_by_id(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch release: {e}\")))?\n        .ok_or_else(|| AppError::NotFound(\"Release not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"Release not found\".into()));\n    }\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    build_full_response(pool, release_id, row).await\n}\n\nasync fn fetch_release_for_team(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003ccrate::domain::releases::ReleaseRow, AppError\u003e {\n    let row = get_release_by_id(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch release: {e}\")))?\n        .ok_or_else(|| AppError::NotFound(\"Release not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"Release not found\".into()));\n    }\n\n    Ok(row)\n}\n\nasync fn build_full_response(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    row: crate::domain::releases::ReleaseRow,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let steps = releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    let linked_rows = releases::get_linked_incidents(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch linked incidents: {e}\")))?;\n\n    let linked = linked_rows\n        .into_iter()\n        .map(|r| crate::domain::releases::LinkedIncidentInfo {\n            id: r.id,\n            title: r.title,\n            status: r.status,\n            severity: r.severity,\n        })\n        .collect();\n\n    Ok(ReleaseResponse::from_row(row, steps, linked))\n}\n\npub async fn start_release(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    release_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let row = fetch_release_for_team(pool, release_id, team_id).await?;\n\n    let current = ReleaseStatus::from_db(\u0026row.status)\n        .ok_or_else(|| AppError::Internal(\"Invalid release status in DB\".into()))?;\n\n    if !can_transition(\u0026current, \u0026ReleaseStatus::InProgress) {\n        return Err(AppError::Validation(format!(\n            \"Cannot start a release in '{}' status\",\n            current.as_str()\n        )));\n    }\n\n    let row = releases::update_release_status(pool, release_id, ReleaseStatus::InProgress.as_str())\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to update release: {e}\")))?;\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseStateChanged {\n                team_id,\n                release_id,\n                new_state: \"in_progress\".to_string(),\n            },\n        )\n        .await;\n\n    build_full_response(pool, release_id, row).await\n}\n\npub async fn validate_step(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    release_id: Uuid,\n    step_id: Uuid,\n    team_id: Uuid,\n    validated_by: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let row = fetch_release_for_team(pool, release_id, team_id).await?;\n\n    let current = ReleaseStatus::from_db(\u0026row.status)\n        .ok_or_else(|| AppError::Internal(\"Invalid release status in DB\".into()))?;\n\n    if current == ReleaseStatus::Blocked {\n        return Err(AppError::Conflict(\n            \"Release is blocked by an active incident. Resolve it first\".into(),\n        ));\n    }\n\n    if current != ReleaseStatus::InProgress {\n        return Err(AppError::Validation(format!(\n            \"Cannot validate steps on a release in '{}' status\",\n            current.as_str()\n        )));\n    }\n\n    let step = releases::get_step_by_id(pool, step_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch step: {e}\")))?\n        .ok_or_else(|| AppError::NotFound(\"Step not found\".into()))?;\n\n    if step.release_id != release_id {\n        return Err(AppError::NotFound(\"Step not found\".into()));\n    }\n\n    if step.validated_by.is_some() {\n        return Err(AppError::Conflict(\"Step already validated\".into()));\n    }\n\n    let all_steps = releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    can_validate_step(step.position, \u0026all_steps).map_err(AppError::Validation)?;\n\n    releases::validate_step(pool, step_id, validated_by)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to validate step: {e}\")))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseStepValidated {\n                team_id,\n                release_id,\n                step_id,\n                step_name: step.name.clone(),\n                by: validated_by,\n            },\n        )\n        .await;\n\n    let unvalidated_count = all_steps\n        .iter()\n        .filter(|s| s.validated_by.is_none())\n        .count();\n\n    let final_row = if unvalidated_count == 1 {\n        releases::update_release_status(pool, release_id, ReleaseStatus::Completed.as_str())\n            .await\n            .map_err(|e| AppError::Internal(format!(\"Failed to complete release: {e}\")))?\n    } else {\n        row\n    };\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseStateChanged {\n                team_id,\n                release_id,\n                new_state: \"completed\".to_string(),\n            },\n        )\n        .await;\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    build_full_response(pool, release_id, final_row).await\n}\n\npub async fn cancel_release(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    release_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let row = fetch_release_for_team(pool, release_id, team_id).await?;\n\n    let current = ReleaseStatus::from_db(\u0026row.status)\n        .ok_or_else(|| AppError::Internal(\"Invalid release status in DB\".into()))?;\n\n    if !current.can_cancel() {\n        return Err(AppError::Validation(format!(\n            \"Cannot cancel a release in '{}' status\",\n            current.as_str()\n        )));\n    }\n\n    let updated =\n        releases::update_release_status(pool, release_id, ReleaseStatus::Cancelled.as_str())\n            .await\n            .map_err(|e| AppError::Internal(format!(\"Failed to cancel release: {e}\")))?;\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseStateChanged {\n                team_id,\n                release_id,\n                new_state: \"cancelled\".to_string(),\n            },\n        )\n        .await;\n\n    build_full_response(pool, release_id, updated).await\n}\n\npub async fn link_incident(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    release_id: Uuid,\n    incident_id: Uuid,\n    team_id: Uuid,\n    linked_by: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let release = fetch_release_for_team(pool, release_id, team_id).await?;\n\n    let current = ReleaseStatus::from_db(\u0026release.status)\n        .ok_or_else(|| AppError::Internal(\"Invalid release status\".into()))?;\n\n    if current.is_terminal() {\n        return Err(AppError::Validation(format!(\n            \"Cannot link incidents to a '{}' release\",\n            current.as_str()\n        )));\n    }\n\n    let incident = repo::incidents::find_incident(pool, incident_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch incident: {e}\")))?\n        .ok_or_else(|| AppError::NotFound(\"Incident not found\".into()))?;\n\n    if incident.team_id != team_id {\n        return Err(AppError::NotFound(\"Incident not found\".into()));\n    }\n\n    let already_linked = releases::has_active_link(pool, release_id, incident_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to check link: {e}\")))?;\n\n    if already_linked {\n        return Err(AppError::Conflict(\n            \"This incident is already linked to this release\".into(),\n        ));\n    }\n\n    releases::create_incident_link(pool, Uuid::new_v4(), release_id, incident_id, linked_by)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to create link: {e}\")))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseIncidentLinked {\n                team_id,\n                release_id,\n                incident_id,\n            },\n        )\n        .await;\n\n    let final_row = if current == ReleaseStatus::InProgress \u0026\u0026 incident.status != \"resolved\" {\n        let blocked =\n            releases::update_release_status(pool, release_id, ReleaseStatus::Blocked.as_str())\n                .await\n                .map_err(|e| AppError::Internal(format!(\"Failed to block release: {e}\")))?;\n\n        broadcaster\n            .to_team(\n                team_id,\n                WsEvent::ReleaseStateChanged {\n                    team_id,\n                    release_id,\n                    new_state: \"blocked\".to_string(),\n                },\n            )\n            .await;\n\n        blocked\n    } else {\n        release\n    };\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    build_full_response(pool, release_id, final_row).await\n}\n\npub async fn unlink_incident(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    release_id: Uuid,\n    incident_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cReleaseResponse, AppError\u003e {\n    let release = fetch_release_for_team(pool, release_id, team_id).await?;\n\n    let removed = releases::remove_incident_link(pool, release_id, incident_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to remove link: {e}\")))?;\n\n    if !removed {\n        return Err(AppError::NotFound(\n            \"No active link between this release and incident\".into(),\n        ));\n    }\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::ReleaseIncidentUnlinked {\n                team_id,\n                release_id,\n                incident_id,\n            },\n        )\n        .await;\n\n    let current = ReleaseStatus::from_db(\u0026release.status)\n        .ok_or_else(|| AppError::Internal(\"Invalid release status\".into()))?;\n\n    let final_row = if current == ReleaseStatus::Blocked {\n        try_unblock_release(pool, \u0026broadcaster, release_id, team_id).await?\n    } else {\n        release\n    };\n\n    releases::get_steps_for_release(pool, release_id)\n        .await\n        .map_err(|e| AppError::Internal(format!(\"Failed to fetch steps: {e}\")))?;\n\n    build_full_response(pool, release_id, final_row).await\n}\n\nasync fn try_unblock_release(\n    pool: \u0026PgPool,\n    broadcaster: \u0026Broadcaster,\n    release_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u00 ayload\n    };\n\n    let rule = repo::rules::insert_rule(\n        pool,\n        NewRule {\n            id: Uuid::new_v4(),\n            team_id,\n            name: input.name.trim(),\n            enabled: input.enabled,\n            trigger_service: \u0026input.trigger.service,\n            trigger_event: \u0026input.trigger.event,\n            trigger_filters: \u0026filters,\n            reaction_type: \u0026input.reaction.reaction_type,\n            reaction_payload: \u0026payload,\n            created_by: actor_id,\n        },\n    )\n    .await?;\n\n    Ok(rule)\n}\n\npub async fn list_rules(pool: \u0026PgPool, team_id: Uuid) -\u003e Result\u003cVec\u003cRule\u003e, AppError\u003e {\n    Ok(repo::rules::list_rules_by_team(pool, team_id).await?)\n}\n\npub async fn get_rule(pool: \u0026PgPool, team_id: Uuid, rule_id: Uuid) -\u003e Result\u003cRule, AppError\u003e {\n    repo::rules::find_rule(pool, team_id, rule_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"Rule not found\".to_string()))\n}\n\npub async fn update_rule(\n    pool: \u0026PgPool,\n    catalog: \u0026ActionCatalog,\n    registry: \u0026ReactionRegistry,\n    team_id: Uuid,\n    rule_id: Uuid,\n    input: UpdateRuleInput,\n) -\u003e Result\u003cRule, AppError\u003e {\n    if let Some(trigger) = \u0026input.trigger\n        \u0026\u0026 !catalog.contains(\u0026trigger.service, \u0026trigger.event)\n    {\n        return Err(AppError::Validation(format!(\n            \"Unknown trigger: {}.{}\",\n            trigger.service, trigger.event\n        )));\n    }\n\n    if let Some(reaction) = \u0026input.reaction\n        \u0026\u0026 !registry.contains(\u0026reaction.reaction_type)\n    {\n        return Err(AppError::Validation(format!(\n            \"Unknown reaction: {}\",\n            reaction.reaction_type\n        )));\n    }\n    if let Some(name) = \u0026input.name\n        \u0026\u0026 name.trim().is_empty()\n    {\n        return Err(AppError::Validation(\n            \"Rule name cannot be empty\".to_string(),\n        ));\n    }\n\n    let trimmed_name = input.name.as_ref().map(|s| s.trim().to_string());\n    let filters_value = input.trigger.as_ref().map(|t| t.filters.clone());\n    let payload_value = input.reaction.as_ref().map(|r| r.payload.clone());\n\n    let patch = RulePatch {\n        name: trimmed_name.as_deref(),\n        enabled: input.enabled,\n        trigger_service: input.trigger.as_ref().map(|t| t.service.as_str()),\n        trigger_event: input.trigger.as_ref().map(|t| t.event.as_str()),\n        trigger_filters: filters_value.as_ref(),\n        reaction_type: input.reaction.as_ref().map(|r| r.reaction_type.as_str()),\n        reaction_payload: payload_value.as_ref(),\n    };\n\n    repo::rules::update_rule(pool, team_id, rule_id, patch)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"Rule not found\".to_string()))\n}\n\npub async fn delete_rule(pool: \u0026PgPool, team_id: Uuid, rule_id: Uuid) -\u003e Result\u003c(), AppError\u003e {\n    let deleted = repo::rules::delete_rule(pool, team_id, rule_id).await?;\n    if !deleted {\n        return Err(AppError::NotFound(\"Rule not found\".to_string()));\n    }\n    Ok(())\n}\n","traces":[{"line":13,"address":[13609712],"length":1,"stats":{"Line":0}},{"line":21,"address":[15996068,15996201],"length":1,"stats":{"Line":0}},{"line":22,"address":[15998381],"length":1,"stats":{"Line":0}},{"line":23,"address":[15996305],"length":1,"stats":{"Line":0}},{"line":27,"address":[15996363,15996275],"length":1,"stats":{"Line":0}},{"line":28,"address":[15996398,15996473],"length":1,"stats":{"Line":0}},{"line":34,"address":[15996440,15996800],"length":1,"stats":{"Line":0}},{"line":35,"address":[15996905,15997008],"length":1,"stats":{"Line":0}},{"line":41,"address":[15997309,15997386,15997496,15996972],"length":1,"stats":{"Line":0}},{"line":42,"address":[15997444,15997396],"length":1,"stats":{"Line":0}},{"line":44,"address":[15997323],"length":1,"stats":{"Line":0}},{"line":46 _db(s).ok_or_else(|| AppError::NotFound(format!(\"Unknown service: {s}\")))\n}\n\npub async fn connect_service(\n    pool: \u0026PgPool,\n    master_key: \u0026[u8; KEY_LEN],\n    user_id: Uuid,\n    service: ServiceName,\n    plaintext_token: \u0026str,\n) -\u003e Result\u003cServiceConnection, AppError\u003e {\n    let trimmed = plaintext_token.trim();\n    if trimmed.is_empty() {\n        return Err(AppError::Validation(\"Token cannot be empty\".to_string()));\n    }\n\n    let encrypted = crypto::encrypt(master_key, trimmed.as_bytes())?;\n\n    let connection =\n        repo::service_connections::upsert_connection(pool, user_id, service, \u0026encrypted).await?;\n\n    Ok(connection)\n}\n\npub async fn list_connections(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n) -\u003e Result\u003cVec\u003cServiceConnection\u003e, AppError\u003e {\n    Ok(repo::service_connections::list_by_user(pool, user_id).await?)\n}\n\npub async fn disconnect_service(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n    service: ServiceName,\n) -\u003e Result\u003c(), AppError\u003e {\n    let deleted = repo::service_connections::delete_connection(pool, user_id, service).await?;\n    if !deleted {\n        return Err(AppError::NotFound(\"Service not connected\".to_string()));\n    }\n    Ok(())\n}\n","traces":[{"line":9,"address":[15720816],"length":1,"stats":{"Line":0}},{"line":10,"address":[15032640,15032659],"length":1,"stats":{"Line":0}},{"line":13,"address":[15720608],"length":1,"stats":{"Line":0}},{"line":20,"address":[15029224,15029341],"length":1,"stats":{"Line":0}},{"line":21,"address":[15029373],"length":1,"stats":{"Line":0}},{"line":22,"address":[15029951,15029421],"length":1,"stats":{"Line":0}},{"line":25,"address":[15029404,15029478,15029901],"length":1,"stats":{"Line":0}},{"line":27,"address":[13805511],"length":1,"stats":{"Line":0}},{"line":30,"address":[15030572],"length":1,"stats":{"Line":0}},{"line":33,"address":[15720720],"length":1,"stats":{"Line":0}},{"line":37,"addre d_team_for_member(pool, team_id, user_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"team not found\".into()))\n}\n\npub async fn get_team_as_member(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    role: Role,\n) -\u003e Result\u003cTeamView, AppError\u003e {\n    let row = repo::teams::find_team_by_id(pool, team_id)\n        .await?\n        .ok_or_else(|| AppError::Internal(\"team vanished after membership check\".into()))?;\n\n    Ok(TeamView {\n        id: row.id,\n        name: row.name,\n        created_at: row.created_at,\n        role,\n    })\n}\n\npub async fn list_members(pool: \u0026PgPool, team_id: Uuid) -\u003e Result\u003cVec\u003cMemberView\u003e, AppError\u003e {\n    let rows = repo::teams::list_team_members(pool, team_id).await?;\n\n    Ok(rows\n        .into_iter()\n        .map(|r| MemberView {\n            user_id: r.user_id,\n            display_name: r.display_name,\n            email: r.email,\n            role: r.role,\n            joined_at: r.joined_at.to_rfc3339(),\n        })\n        .collect())\n}\n\npub async fn change_member_role(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    manager_id: Uuid,\n    team_id: Uuid,\n    target_user_id: Uuid,\n    new_role: Role,\n) -\u003e Result\u003c(), AppError\u003e {\n    if manager_id == target_user_id {\n        return Err(AppError::Validation(\"cannot change your own role\".into()));\n    }\n\n    if new_role == Role::Manager {\n        return Err(AppError::Validation(\n            \"use the transfer endpoint to assign the Manager role\".into(),\n        ));\n    }\n\n    let updated =\n        repo::teams::update_member_role(pool, team_id, target_user_id, new_role.as_str()).await?;\n\n    if !updated {\n        return Err(AppError::NotFound(\"member not found\".into()));\n    }\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::MemberRoleChanged {\n                team_id,\n                user_id: target_user_id,\n                new_role: new_role.as_str().to_string(),\n                by: manager_id,\n            },\n        )\n        .await;\n\n    Ok(())\n}\n\npub async fn transfer_manager(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    team_id: Uuid,\n    current_manager_id: Uuid,\n    target_user_id: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    if current_manager_id == target_user_id {\n        return Err(AppError::Validation(\n            \"cannot transfer manager role to yourself\".into(),\n        ));\n    }\n\n    let target = repo::teams::find_membership(pool, team_id, target_user_id).await?;\n    if target.is_none() {\n        return Err(AppError::NotFound(\"target member not found\".into()));\n    }\n\n    let mut tx = pool.begin().await?;\n\n    repo::teams::update_member_role_tx(\n        \u0026mut tx,\n        team_id,\n        current_manager_id,\n        Role::Responder.as_str(),\n    )\n    .await?;\n\n    let promoted = repo::teams::update_member_role_tx(\n        \u0026mut tx,\n        team_id,\n        target_user_id,\n        Role::Manager.as_str(),\n    )\n    .await?;\n\n    if !promoted {\n        return Err(AppError::Internal(\n            \"target member vanished during transfer\".into(),\n        ));\n    }\n\n    tx.commit().await?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::MemberRoleChanged {\n                team_id,\n                user_id: current_manager_id,\n                new_role: \"responder\".to_string(),\n                by: current_manager_id,\n            },\n        )\n        .await;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::MemberRoleChanged {\n                team_id,\n                user_id: target_user_id,\n                new_role: \"manager\".to_string(),\n                by: current_manager_id,\n            },\n        )\n        .await;\n\n    Ok(())\n}\n\npub async fn leave_team(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n    role: Role,\n) -\u003e Result\u003c(), AppError\u003e {\n    if role == Role::Manager {\n        return Err(AppError::Conflict(\n            \"transfer the manager role before leaving\".into(),\n        ));\n    }\n\n    let updated = repo::teams::deactivate_member(pool, team_id, user_id).await?;\n\n    if !updated {\n        return Err(AppError::Internal(\"member vanished during leave\".into()));\n    }\n\n    Ok(())\n}\n\nasync fn check_moderation_target(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    manager_id: Uuid,\n    target_user_id: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    if manager_id == target_user_id {\n        return Err(AppError::Validation(\"cannot moderate yourself\".into()));\n    }\n\n    let membership = repo::teams::find_membership(pool, team_id, target_user_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"member not found\".into()))?;\n\n    let target_role = Role::from_db(membership.role.as_str())\n        .ok_or_else(|| AppError::Internal(\"invalid role in database\".into()))?;\n\n    if target_role == Role::Manager {\n        return Err(AppError::Validation(\n            \"cannot kick or ban the current Manager; transfer the role first\".into(),\n        ));\n    }\n\n    Ok(())\n}\n\npub async fn kick_member(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    team_id: Uuid,\n    manager_id: Uuid,\n    target_user_id: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    check_moderation_target(pool, team_id, manager_id, target_user_id).await?;\n\n    let updated = repo::teams::deactivate_member(pool, team_id, target_user_id).await?;\n    if !updated {\n        return Err(AppError::Internal(\"member vanished during kick\".into()));\n    }\n\n    let event = WsEvent::MemberKicked {\n        team_id,\n        user_id: target_user_id,\n        by: manager_id,\n    };\n\n    broadcaster.to_team(team_id, event.clone()).await;\n    broadcaster.to_user(target_user_id, event);\n\n    Ok(())\n}\n\npub async fn ban_member(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    team_id: Uuid,\n    manager_id: Uuid,\n    target_user_id: Uuid,\n    expires_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    reason: Option\u003cString\u003e,\n) -\u003e Result\u003c(), AppError\u003e {\n    if let Some(exp) = expires_at\n        \u0026\u0026 exp \u003c= Utc::now()\n    {\n        return Err(AppError::Validation(\n            \"ban expiry must be in the future\".into(),\n        ));\n    }\n\n    check_moderation_target(pool, team_id, manager_id, target_user_id).await?;\n\n    let mut tx = pool.begin().await?;\n\n    let updated = repo::teams::deactivate_member_tx(\u0026mut tx, team_id, target_user_id).await?;\n    if !updated {\n        return Err(AppError::Internal(\"member vanished during ban\".into()));\n    }\n\n    repo::teams::insert_ban(\n        \u0026mut tx,\n        Uuid::new_v4(),\n        team_id,\n        target_user_id,\n        manager_id,\n        reason.as_deref(),\n        expires_at,\n    )\n    .await?;\n\n    tx.commit().await?;\n\n    let event = WsEvent::MemberBanned {\n        team_id,\n        user_id: target_user_id,\n        expires_at: expires_at.map(|t| t.timestamp()),\n        by: manager_id,\n    };\n\n    broadcaster.to_team(team_id, event.clone()).await;\n    broadcaster.to_user(target_user_id, event);\n\n    Ok(())\n}\n\npub async fn unban_member(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    target_user_id: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    let lifted = repo::teams::lift_active_ban(pool, team_id, target_user_id).await?;\n    if !lifted {\n        return Err(AppError::NotFound(\"no active ban found\".into()));\n    }\n    Ok(())\n}\n","traces":[{"line":20,"address":[13524912],"length":1,"stats":{"Line":0}},{"line":25,"address":[14633232,14629919,14633256,14629764,14630345],"length":1,"stats":{"Line":0}},{"line":28,"address":[14630132],"length":1,"stats":{"Line":0}},{"line":29,"address":[ dcaster {\n    inner: Arc\u003cInner\u003e,\n}\n\nstruct Inner {\n    connections: DashMap\u003cUuid, Vec\u003cSender\u003e\u003e,\n    pool: PgPool,\n}\n\nimpl Broadcaster {\n    pub fn new(pool: PgPool) -\u003e Self {\n        Self {\n            inner: Arc::new(Inner {\n                connections: DashMap::new(),\n                pool,\n            }),\n        }\n    }\n\n    pub fn register(\u0026self, user_id: Uuid) -\u003e UnboundedReceiver\u003cWsEvent\u003e {\n        let (tx, rx) = mpsc::unbounded_channel();\n        self.inner.connections.entry(user_id).or_default().push(tx);\n        rx\n    }\n\n    fn cleanup_dead(\u0026self, user_id: Uuid) {\n        if let Some(mut entry) = self.inner.connections.get_mut(\u0026user_id) {\n            entry.retain(|tx| !tx.is_closed());\n        }\n        if let Some(entry) = self.inner.connections.get(\u0026user_id)\n            \u0026\u0026 entry.is_empty()\n        {\n            drop(entry);\n            self.inner.connections.remove(\u0026user_id);\n        }\n    }\n\n    pub fn to_user(\u0026self, user_id: Uuid, event: WsEvent) {\n        let mut had_dead = false;\n        if let Some(entry) = self.inner.connections.get(\u0026user_id) {\n            for tx in entry.iter() {\n                if tx.send(event.clone()).is_err() {\n                    had_dead = true;\n                }\n            }\n        }\n        if had_dead {\n            self.cleanup_dead(user_id);\n        }\n    }\n\n    pub async fn to_team(\u0026self, team_id: Uuid, event: WsEvent) {\n        let user_ids = match sqlx::query_scalar!(\n            r#\"\n            SELECT user_id\n            FROM team_members\n            WHERE team_id = $1 AND status = 'active'\n            \"#,\n            team_id,\n        )\n        .fetch_all(\u0026self.inner.pool)\n        .await\n        {\n            Ok(ids) =\u003e ids,\n            Err(e) =\u003e {\n                tracing::error!(\"broadcaster: failed to fetch team members: {e}\");\n                return;\n            }\n        };\n        tracing::info!(\"to_team: team={} found {} members\", team_id, user_ids.len());\n        for user_id in user_ids {\n            self.to_user(user_id, event.clone());\n        }\n    }\n}\n","traces":[{"line":23,"address":[13523569,13523408,13523543],"length":1,"stats":{"Line":0}},{"line":25,"address":[13523480,13523420],"length":1,"stats":{"Line":0}},{"line":32,"address":[13524368,13524628,13524641],"length":1,"stats":{"Line":0}},{"line":33,"address":[13524390],"length":1,"stats":{"Line":0}},{"line":34,"address":[13524420,13524479],"length":1,"stats":{"Line":0}},{"line":35,"address":[13524610],"length":1,"stats":{"Line":0}},{"line":38,"address":[13523088,13522848],"length":1,"stats":{"Line":0}},{"line":39,"address":[13522873],"length":1,"stats":{"Line":0}},{"line":40,"address":[13523069,13522957],"length":1,"stats":{"Line":0}},{"line":42,"address":[13523107,13523376,13522974],"length":1,"stats":{"Line":0}},{"line":43,"address":[13523149,13523212],"length":1,"stats":{"Line":0}},{"line":45,"address":[13523256],"length":1,"stats":{"Line":0}},{"line":46,"address":[13523316],"length":1,"stats":{"Line":0}},{"line":50,"address":[13524346,13524284,13523680],"length":1,"stats":{"Line":0}},{"line":51,"address":[13523710],"length":1,"stats":{"Line":0}},{"line":52,"address":[13523779,13523715],"length":1,"stats":{"Line":0}},{"line":53,"address":[13523851,13523924],"length":1,"stats":{"Line":0}},{"line":54,"address":[13524165,13524119,13524279],"length":1,"stats":{"Line":0}},{"line":55,"address":[13524274],"length":1,"stats":{"Line":0}},{"line":59,"address":[13523863],"length":1,"stats":{"Line":0}},{"line":60,"address":[13524318],"length":1,"stats":{"Line":0}},{"line":64,"address":[13523619,13523584],"length":1,"stats":{"Line":0}},{"line":65,"address":[15906307,15907100,15906280,15907397,15907459,15906163,15906833,15906975,15906884,15906229,15907186],"length":1,"stats":{"Line":0}},{"line":73,"address":[15906237,15906841,15  new_state: String,\n    },\n\n    MemberKicked {\n        team_id: Uuid,\n        user_id: Uuid,\n        by: Uuid,\n    },\n\n    MemberBanned {\n        team_id: Uuid,\n        user_id: Uuid,\n        expires_at: Option\u003ci64\u003e,\n        by: Uuid,\n    },\n\n    ReleaseIncidentLinked {\n        team_id: Uuid,\n        release_id: Uuid,\n        incident_id: Uuid,\n    },\n\n    ReleaseIncidentUnlinked {\n        team_id: Uuid,\n        release_id: Uuid,\n        incident_id: Uuid,\n    },\n\n    ReleaseStepValidated {\n        team_id: Uuid,\n        release_id: Uuid,\n        step_id: Uuid,\n        step_name: String,\n        by: Uuid,\n    },\n\n    RuleTriggered {\n        team_id: Uuid,\n        rule_id: Uuid,\n        rule_name: String,\n        reaction_type: String,\n    },\n\n    RuleFailed {\n        team_id: Uuid,\n        rule_id: Uuid,\n        rule_name: String,\n        reaction_type: String,\n        error: String,\n    },\n\n    TimelineEntryEdited {\n        team_id: Uuid,\n        incident_id: Uuid,\n        entry_id: Uuid,\n        new_content: String,\n        edited_at: i64,\n    },\n\n    ReactionAdded {\n        team_id: Uuid,\n        incident_id: Uuid,\n        entry_id: Uuid,\n        emoji: String,\n        user_id: Uuid,\n    },\n\n    ReactionRemoved {\n        team_id: Uuid,\n        incident_id: Uuid,\n        entry_id: Uuid,\n        emoji: String,\n        user_id: Uuid,\n    },\n\n    PrivateMessageReceived {\n        from: Uuid,\n        to: Uuid,\n        message_id: Uuid,\n        content: String,\n        at: i64,\n    },\n}\n\n#[derive(Debug, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum WsClientMessage {\n    Watch {\n        resource_type: String,\n        resource_id: Uuid,\n        team_id: Uuid,\n    },\n    Unwatch {\n        resource_type: String,\n        resource_id: Uuid,\n        team_id: Uuid,\n    },\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","haja","Projects","VIGIL","server","src","ws","handler.rs"],"content":"use axum::{\n    extract::{\n        Query, State,\n        ws::{Message, WebSocket, WebSocketUpgrade},\n    },\n    response::Response,\n};\nuse serde::Deserialize;\nuse sha2::{Digest, Sha256};\nuse std::collections::HashSet;\n\nuse crate::{\n    state::AppState,\n    ws::events::{WsClientMessage, WsEvent},\n    ws::presence::ResourceKey,\n};\n\n#[derive(Deserialize)]\npub struct WsQuery {\n    pub token: String,\n}\n\npub async fn ws_handler(\n    State(state): State\u003cAppState\u003e,\n    Query(query): Query\u003cWsQuery\u003e,\n    ws: WebSocketUpgrade,\n) -\u003e Response {\n    let raw_token = match hex::decode(\u0026query.token) {\n        Ok(bytes) =\u003e bytes,\n        Err(_) =\u003e {\n            return axum::http::Response::builder()\n                .status(401)\n                .body(axum::body::Body::from(\"invalid token\"))\n                .unwrap();\n        }\n    };\n    let token_hash = Sha256::digest(\u0026raw_token).to_vec();\n\n    let user_id = match sqlx::query!(\n        r#\"\n        SELECT user_id\n        FROM sessions\n        WHERE token_hash = $1 AND expires_at \u003e now()\n        \"#,\n        token_hash,\n    )\n    .fetch_optional(\u0026state.pool)\n    .await\n    {\n        Ok(Some(row)) =\u003e row.user_id,\n        Ok(None) =\u003e {\n            return axum::http::Response::builder()\n                .status(401)\n                .body(axum::body::Body::from(\"invalid token\"))\n                .unwrap();\n        }\n        Err(e) =\u003e {\n            tracing::error!(\"ws auth db error: {e}\");\n            return axum::http::Response::builder()\n                .status(500)\n                .body(axum::body::Body::from(\"internal error\"))\n                .unwrap();\n        }\n    };\n\n    ws.on_upgrade(move |socket| handle_socket(socket, state, user_id))\n}\n\nasync fn handle_socket(mut socket: WebSocket, state: AppState, user_id: uuid::Uuid) {\n    let mut rx = state.broadcaster.register(user_id);\n\n    let mut watching: HashSet\u003cResourceKey\u003e = HashSet::new();\n\n    let hello = WsEvent::Connected { user_id };\n    if let Ok(json) = serde_json::to_string(\u0026hello) {\n        let _ = socket.send(Message::Text(json.into())).await;\n    }\n\n    loop {\n        tokio::select! {\n            event = rx.recv() =\u003e {\n                match event {\n                    Some(event) =\u003e {\n                        let json = match serde_json::to_string(\u0026event) {\n                            Ok(s) =\u003e s,\n                            Err(e) =\u003e {\n                                tracing::error!(\"ws serialize error: {e}\");\n                                continue;\n                            }\n                        };\n                        if socket.send(Message::Text(json.into())).await.is_err() {\n                            break;\n                        }\n                    }\n                    None =\u003e break,\n                }\n            }\n\n            msg = socket.recv() =\u003e {\n                match msg {\n                    Some(Ok(Message::Text(text))) =\u003e {\n                        if let Ok(cmd) = serde_json::from_str::\u003cWsClientMessage\u003e(\u0026text) {\n                            match cmd {\n                                WsClientMessage::Watch { resource_type, resource_id, team_id } =\u003e {\n                                    let key = ResourceKey {\n                                        resource_type: resource_type.clone(),\n                                        resource_id,\n                                    };\n                                    watching.insert(key);\n\n                                    let watchers = state.presence.watch(\n                                        user_id,\n                                        resource_type.clone(),\n                                        resource_id,\n     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/').map(decodeURIComponent);
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
