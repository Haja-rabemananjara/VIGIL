<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

st]\n    fn registered_actions_are_findable() {\n        let catalog = ActionCatalog::builder()\n            .register(\"github\", \"workflow_run\", \"CI workflow finished\")\n            .register(\"github\", \"push\", \"Commits pushed to a branch\")\n            .build();\n\n        let actions = catalog.all();\n        assert_eq!(actions.len(), 2);\n        assert_eq!(actions[0].service, \"github\");\n        assert_eq!(actions[0].event, \"workflow_run\");\n    }\n\n    #[test]\n    fn registration_order_is_preserved() {\n        let catalog = ActionCatalog::builder()\n            .register(\"a\", \"one\", \"d1\")\n            .register(\"b\", \"two\", \"d2\")\n            .register(\"c\", \"three\", \"d3\")\n            .build();\n\n        let events: Vec\u003c\u0026str\u003e = catalog.all().iter().map(|a| a.event.as_str()).collect();\n        assert_eq!(events, vec![\"one\", \"two\", \"three\"]);\n    }\n\n    #[test]\n    fn contains_matches_registered_pairs_only() {\n        let catalog = ActionCatalog::builder()\n            .register(\"github\", \"workflow_run\", \"CI finished\")\n            .build();\n\n        assert!(catalog.contains(\"github\", \"workflow_run\"));\n        assert!(!catalog.contains(\"github\", \"push\"));\n        assert!(!catalog.contains(\"gitlab\", \"workflow_run\"));\n    }\n}\n","traces":[{"line":14,"address":[13698400],"length":1,"stats":{"Line":1}},{"line":16,"address":[13698413],"length":1,"stats":{"Line":1}},{"line":20,"address":[13698384],"length":1,"stats":{"Line":2}},{"line":21,"address":[13698389],"length":1,"stats":{"Line":2}},{"line":24,"address":[13698464],"length":1,"stats":{"Line":1}},{"line":25,"address":[13698492],"length":1,"stats":{"Line":1}},{"line":27,"address":[13213088,13213125],"length":1,"stats":{"Line":3}},{"line":36,"address":[13213184,13213731,13213765],"length":1,"stats":{"Line":1}},{"line":42,"address":[13213590,13213316],"length":1,"stats":{"Line":2}},{"line":43,"address":[13213348],"length":1,"stats"  Err(err) =\u003e {\n            tracing::error!(\n                delivery_id = %delivery_id,\n                error = %err,\n                \"Failed to load matching rules. Aborting evaluation\"\n            );\n            return;\n        }\n    };\n\n    if rules.is_empty() {\n        tracing::debug!(\n            delivery_id = %delivery_id,\n            service = %service,\n            event = %event,\n            \"No matching rules for this delivery\"\n        );\n        return;\n    }\n\n    tracing::info!(\n        delivery_id = %delivery_id,\n        service = %service,\n        event = %event,\n        rules_count = rules.len(),\n        \"Evaluating rules\"\n    );\n\n    for rule in rules {\n        evaluate_one(ctx, \u0026rule, payload).await;\n    }\n}\n\nasync fn evaluate_one(ctx: \u0026EngineContext\u003c'_\u003e, rule: \u0026Rule, payload: \u0026Value) {\n    if !matcher::matches(payload, \u0026rule.trigger_filters) {\n        tracing::debug!(\n            rule_id = %rule.id,\n            rule_name = %rule.name,\n            \"Rule filters did not match\"\n        );\n        return;\n    }\n\n    let Some(executor) = ctx.registry.get(\u0026rule.reaction_type) else {\n        let error = format!(\"Reaction '{}' is not registered\", rule.reaction_type);\n        tracing::warn!(\n            rule_id = %rule.id,\n            rule_name = %rule.name,\n            reaction_type = %rule.reaction_type,\n            \"{error}\"\n        );\n        broadcast_failed(ctx.broadcaster, rule, \u0026error).await;\n        return;\n    };\n\n    let rendered_payload = templating::render(\u0026rule.reaction_payload, payload);\n\n    let reaction_ctx = ReactionContext {\n        pool: ctx.pool,\n        broadcaster: ctx.broadcaster,\n        team_id: rule.team_id,\n        rule_id: rule.id,\n        rule_name: \u0026rule.name,\n        rule_created_by: rule.created_by,\n        payload: \u0026rendered_payload,\n        http_client: ctx.http_client,\n        maste ters = json!({ \"workflow_run.conclusion\": \"failure\" });\n        assert!(!matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn deep_nesting_works() {\n        let payload = json!({\n            \"a\": { \"b\": { \"c\": { \"d\": \"found\" } } }\n        });\n        let filters = json!({ \"a.b.c.d\": \"found\" });\n        assert!(matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn all_filters_must_match() {\n        let payload = json!({\n            \"workflow_run\": { \"conclusion\": \"failure\" },\n            \"repository\": { \"full_name\": \"org/repo\" }\n        });\n        let filters = json!({\n            \"workflow_run.conclusion\": \"failure\",\n            \"repository.full_name\": \"org/repo\"\n        });\n        assert!(matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn one_bad_filter_fails_the_whole_match() {\n        let payload = json!({\n            \"workflow_run\": { \"conclusion\": \"failure\" },\n            \"repository\": { \"full_name\": \"wrong/repo\" }\n        });\n        let filters = json!({\n            \"workflow_run.conclusion\": \"failure\",\n            \"repository.full_name\": \"org/repo\"\n        });\n        assert!(!matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn boolean_values_match() {\n        let payload = json!({ \"draft\": false });\n        let filters = json!({ \"draft\": false });\n        assert!(matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn number_values_match() {\n        let payload = json!({ \"attempt\": 3 });\n        let filters = json!({ \"attempt\": 3 });\n        assert!(matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn type_mismatch_does_not_match() {\n        let payload = json!({ \"attempt\": 3 });\n        let filters = json!({ \"attempt\": \"3\" });\n        assert!(!matches(\u0026payload, \u0026filters));\n    }\n\n    #[test]\n    fn full_github_workflow_run_scenario() {\n :13},{"path":["/","home","haja","Projects","VIGIL","server","src","hooks","templating.rs"],"content":"use serde_json::{Map, Value};\n\npub fn render(template: \u0026Value, context: \u0026Value) -\u003e Value {\n    match template {\n        Value::String(s) =\u003e Value::String(render_string(s, context)),\n        Value::Array(arr) =\u003e Value::Array(arr.iter().map(|v| render(v, context)).collect()),\n        Value::Object(obj) =\u003e {\n            let mut out = Map::with_capacity(obj.len());\n            for (k, v) in obj {\n                out.insert(k.clone(), render(v, context));\n            }\n            Value::Object(out)\n        }\n        other =\u003e other.clone(),\n    }\n}\n\nfn render_string(template: \u0026str, context: \u0026Value) -\u003e String {\n    let mut out = String::with_capacity(template.len());\n    let mut rest = template;\n\n    while let Some(start) = rest.find(\"{{\") {\n        out.push_str(\u0026rest[..start]);\n\n        let after_open = \u0026rest[start + 2..];\n        let Some(end_rel) = after_open.find(\"}}\") else {\n            out.push_str(\u0026rest[start..]);\n            return out;\n        };\n\n        let raw_path = \u0026after_open[..end_rel];\n        let path = raw_path.trim();\n\n        match navigate(context, path) {\n            Some(value) =\u003e out.push_str(\u0026stringify(value)),\n            None =\u003e {\n                out.push_str(\"{{\");\n                out.push_str(raw_path);\n                out.push_str(\"}}\");\n            }\n        }\n\n        rest = \u0026after_open[end_rel + 2..];\n    }\n\n    out.push_str(rest);\n    out\n}\n\nfn navigate\u003c'a\u003e(context: \u0026'a Value, path: \u0026str) -\u003e Option\u003c\u0026'a Value\u003e {\n    let mut current = context;\n    for segment in path.split('.') {\n        current = current.get(segment)?;\n    }\n    Some(current)\n}\n\nfn stringify(value: \u0026Value) -\u003e String {\n    match value {\n        Value::String(s) =\u003e s.clone(),\n        other =\u003e other.to_string(),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n\n    #[test]\n    fn plain_string_passes_through() {\n        let out = render(\u0026json!(\"hello world\"), \u0026json!({}));\n        assert_eq!(out, json!(\"hello world\"));\n    }\n\n    #[test]\n    fn non_string_values_pass_through() {\n        assert_eq!(render(\u0026json!(42), \u0026json!({})), json!(42));\n        assert_eq!(render(\u0026json!(true), \u0026json!({})), json!(true));\n        assert_eq!(render(\u0026json!(null), \u0026json!({})), json!(null));\n    }\n\n    #[test]\n    fn top_level_placeholder_substitutes() {\n        let template = json!(\"Hello {{name}}!\");\n        let context = json!({ \"name\": \"Alice\" });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Hello Alice!\"));\n    }\n\n    #[test]\n    fn nested_placeholder_substitutes() {\n        let template = json!(\"CI broken on {{repository.name}}\");\n        let context = json!({ \"repository\": { \"name\": \"my-repo\" } });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"CI broken on my-repo\"));\n    }\n\n    #[test]\n    fn placeholder_with_spaces_substitutes() {\n        // Whitespace inside `{{ ... }}` is trimmed.\n        let template = json!(\"Hi {{ name }}\");\n        let context = json!({ \"name\": \"Bob\" });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Hi Bob\"));\n    }\n\n    #[test]\n    fn multiple_placeholders_in_one_string() {\n        let template = json!(\"Workflow {{workflow.name}} failed on {{repository.name}}\");\n        let context = json!({\n            \"workflow\": { \"name\": \"CI\" },\n            \"repository\": { \"name\": \"my-repo\" }\n        });\n        assert_eq!(\n            render(\u0026template, \u0026context),\n            json!(\"Workflow CI failed on my-repo\")\n        );\n    }\n\n    #[test]\n    fn missing_path_leaves_placeholder_literal() {\n        let template = json!(\"Hello {{name}}!\");\n        let context = json!({});\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Hello {{name}}!\"));\n    }\n\n    #[test]\n    fn missing_nested_path_leaves_placeholder_literal() {\n        let template = json!(\"On {{repository.private}}\");\n        let context = json!({ \"repository\": { \"name\": \"my-repo\" } });\n        assert_eq!(\n            render(\u0026template, \u0026context),\n            json!(\"On {{repository.private}}\")\n        );\n    }\n\n    #[test]\n    fn number_context_stringifies() {\n        let template = json!(\"Count: {{count}}\");\n        let context = json!({ \"count\": 42 });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Count: 42\"));\n    }\n\n    #[test]\n    fn boolean_context_stringifies() {\n        let template = json!(\"Draft: {{draft}}\");\n        let context = json!({ \"draft\": false });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Draft: false\"));\n    }\n\n    #[test]\n    fn nested_object_template_is_walked() {\n        let template = json!({\n            \"title\": \"CI broken on {{repository.name}}\",\n            \"severity\": \"high\",\n            \"body\": \"Workflow {{workflow.name}} failed\"\n        });\n        let context = json!({\n            \"repository\": { \"name\": \"my-repo\" },\n            \"workflow\": { \"name\": \"CI\" }\n        });\n\n        assert_eq!(\n            render(\u0026template, \u0026context),\n            json!({\n                \"title\": \"CI broken on my-repo\",\n                \"severity\": \"high\",\n                \"body\": \"Workflow CI failed\"\n            })\n        );\n    }\n\n    #[test]\n    fn nested_array_template_is_walked() {\n        let template = json!([\"{{a}}\", \"{{b}}\", \"literal\"]);\n        let context = json!({ \"a\": \"AAA\", \"b\": \"BBB\" });\n        assert_eq!(\n            render(\u0026template, \u0026context),\n            json!([\"AAA\", \"BBB\", \"literal\"])\n        );\n    }\n\n    #[test]\n    fn unclosed_placeholder_kept_literal() {\n        let template = json!(\"Hello {{name\");\n        let context = json!({ \"name\": \"Alice\" });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Hello {{name\"));\n    }\n\n    #[test]\n    fn empty_placeholder_treated_as_missing() {\n        let template = json!(\"Odd: {{}}\");\n        let context = json!({ \"name\": \"Alice\" });\n        assert_eq!(render(\u0026template, \u0026context), json!(\"Odd: {{}}\"));\n    }\n\n    #[test]\n    fn full_vigil_create_incident_reaction() {\n        let template = json!({\n            \"title\": \"CI broken on {{repository.name}}\",\n            \"severity\": \"high\",\n            \"body\": \"Workflow {{workflow.name}} failed — [View run]({{run.url}})\"\n        });\n        let context = json!({\n            \"repository\": { \"name\": \"my-repo\", \"id\": 42 },\n            \"workflow\": { \"name\": \"CI\" },\n            \"run\": { \"url\": \"https://github.com/org/repo/actions/runs/12345\" }\n        });\n\n        assert_eq!(\n            render(\u0026template, \u0026context),\n            json!({\n                \"title\": \"CI broken on my-repo\",\n                \"severity\": \"high\",\n                \"body\": \"Workflow CI failed — [View run](https://github.com/org/repo/actions/runs/12345)\"\n            })\n        );\n    }\n}\n","traces":[{"line":3,"address":[14667634,14666784,14667640],"length":1,"stats":{"Line":1}},{"line":4,"address":[14666827],"length":1,"stats":{"Line":1}},{"line":5,"address":[14666906],"length":1,"stats":{"Line":1}},{"line":6,"address":[13200832,13200867],"length":1,"stats":{"Line":3}},{"line":7,"address":[14667091],"length":1,"stats":{"Line":1}},{"line":8,"address":[14667108],"length":1,"stats":{"Line":1}},{"line":9,"address":[14667206,14667142],"length":1,"stats":{"Line":2}},{"line":10,"address":[14667475,14667498,14667350],"length":1 rc::new(VigilValidateReleaseStep::new()))\n        .register(Arc::new(DiscordMessage::new()))\n        .build();\n\n    let http_client = reqwest::Client::builder()\n        .timeout(std::time::Duration::from_secs(10))\n        .build()\n        .expect(\"Failed to build HTTP client\");\n\n    let action_catalog = ActionCatalog::builder()\n        .register(\n            \"github\",\n            \"workflow_run\",\n            \"A CI workflow run has completed (success or failure)\",\n        )\n        .register(\"github\", \"push\", \"New commits have been pushed to a branch\")\n        .register(\n            \"github\",\n            \"pull_request\",\n            \"A pull request has been opened, updated or closed\",\n        )\n        .build();\n\n    let state = AppState {\n        pool: pool.clone(),\n        broadcaster: Broadcaster::new(pool.clone()),\n        presence: PresenceTracker::new(),\n        webhook_secret: config.webhook_secret,\n        master_key: config.master_key,\n        registry,\n        http_client,\n        action_catalog,\n        kickoff_token: config.kickoff_token,\n    };\n\n    let cors = CorsLayer::new()\n        .allow_origin([\n            \"http://localhost:3000\".parse::\u003cHeaderValue\u003e().unwrap(),\n            \"http://localhost:3001\".parse::\u003cHeaderValue\u003e().unwrap(),\n            \"tauri://localhost\".parse::\u003cHeaderValue\u003e().unwrap(),\n            \"http://localhost:9527\".parse::\u003cHeaderValue\u003e().unwrap(),\n            \"http://localhost:8081\".parse::\u003cHeaderValue\u003e().unwrap(),\n        ])\n        .allow_methods([Method::GET, Method::POST, Method::PATCH, Method::DELETE])\n        .allow_headers([\n            axum::http::header::CONTENT_TYPE,\n            axum::http::header::AUTHORIZATION,\n        ]);\n\n    let app = routes::router()\n        .layer(tower_http::trace::TraceLayer::new_for_http())\n        .layer(cors)\n        .with_state(state);\n\n    let addr = format!(\"{}:{}\", config.server_host, config.server_port);\n    let listener = TcpListener::bind(\u0026addr).await?;\n    tracing::info!(\"VIGIL server listening on {addr}\");\n\n    axum::serve(\n        listener,\n        app.into_make_service_with_connect_info::\u003cSocketAddr\u003e(),\n    )\n    .await?;\n\n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","haja","Projects","VIGIL","server","src","repo","incidents.rs"],"content":"use chrono::{DateTime, Utc};\nuse sqlx::PgPool;\nuse uuid::Uuid;\n\nuse crate::error::AppError;\n\npub struct IncidentRow {\n    pub id: Uuid,\n    pub team_id: Uuid,\n    pub title: String,\n    pub body: String,\n    pub severity: String,\n    pub status: String,\n    pub created_by: Uuid,\n    pub created_at: DateTime\u003cUtc\u003e,\n    pub updated_at: DateTime\u003cUtc\u003e,\n    pub acknowledged_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    pub escalated_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    pub resolved_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    pub assignee_id: Option\u003cUuid\u003e,\n}\n\npub async fn create_incident(\n    pool: \u0026PgPool,\n    id: Uuid,\n    team_id: Uuid,\n    title: \u0026str,\n    body: \u0026str,\n    severity: \u0026str,\n    created_by: Uuid,\n) -\u003e Result\u003cIncidentRow, AppError\u003e {\n    let row = sqlx::query_as!(\n        IncidentRow,\n        r#\"\n        INSERT INTO incidents (id, team_id, title, body, severity, status, created_by, created_at, updated_at)\n        VALUES ($1, $2, $3, $4, $5, 'open', $6, now(), now())\n        RETURNING\n            id,\n            team_id,\n            title,\n            body,\n            severity,\n            status,\n            created_by,\n            created_at,\n            updated_at,\n            acknowledged_at,\n            escalated_at,\n            resolved_at,\n            (SELECT user_id FROM incident_assignments\n             WHERE incident_id = incidents.id AND status = 'active'\n             LIMIT 1) AS \"assignee_id?\"\n        \"#,\n        id,\n        team_id,\n        title,\n        body,\n        severity,\n        created_by,\n    )\n        .fetch_one(pool)\n        .await?;\n\n    Ok(row)\n}\n\npub async fn list_incidents(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    status_filter: Option\u003c\u0026str\u003e,\n    severity_filter: Option\u003c\u0026str\u003e,\n) -\u003e Result\u003cVec\u003cIncidentRow\u003e, AppError\u003e {\n    let rows = sqlx::query_as!(\n        IncidentRow,\n        r#\"\n        SELECT\n            i.id,\n            i.team_id,\n            i.title,\n            i.body,\n            i.severity,\n            i.status,\n            i.created_by,\n            i.created_at,\n            i.updated_at,\n            i.acknowledged_at,\n            i.escalated_at,\n            i.resolved_at,\n            ia.user_id AS \"assignee_id?\"\n        FROM incidents i\n        LEFT JOIN incident_assignments ia\n            ON ia.incident_id = i.id AND ia.status = 'active'\n        WHERE i.team_id = $1\n          AND ($2::text IS NULL OR i.status = $2)\n          AND ($3::text IS NULL OR i.severity = $3)\n        ORDER BY i.created_at DESC\n        \"#,\n        team_id,\n        status_filter,\n        severity_filter,\n    )\n    .fetch_all(pool)\n    .await?;\n\n    Ok(rows)\n}\n\npub async fn find_incident(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n) -\u003e Result\u003cOption\u003cIncidentRow\u003e, AppError\u003e {\n    let row = sqlx::query_as!(\n        IncidentRow,\n        r#\"\n        SELECT\n            i.id,\n            i.team_id,\n            i.title,\n            i.body,\n            i.severity,\n            i.status,\n            i.created_by,\n            i.created_at,\n            i.updated_at,\n            i.acknowledged_at,\n            i.escalated_at,\n            i.resolved_at,\n            ia.user_id AS \"assignee_id?\"\n        FROM incidents i\n        LEFT JOIN incident_assignments ia\n            ON ia.incident_id = i.id AND ia.status = 'active'\n        WHERE i.id = $1\n        \"#,\n        incident_id,\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub async fn update_incident_status(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    new_status: \u0026str,\n    new_severity: Option\u003c\u0026str\u003e,\n) -\u003e Result\u003cIncidentRow, AppError\u003e {\n    let row = sqlx::query_as!(\n        IncidentRow,\n        r#\"\n        UPDATE incidents\n        SET\n            status          = $2,\n            severity        = COALESCE($3, severity),\n            acknowledged_at = CASE WHEN $2 = 'acknowledged' THEN now() ELSE acknowledged_at END,\n            escalated_at    = CASE WHEN $2 = 'escalated'    THEN now() ELSE escalated_at    END,\n            resolved_at     = CASE WHEN $2 = 'resolved'     THEN now() ELSE resolved_at     END,\n            updated_at      = now()\n        WHERE id = $1\n        RETURNING\n            id, team_id, title, body, severity, status, created_by,\n            created_at, updated_at, acknowledged_at, escalated_at, resolved_at,\n            (SELECT user_id FROM incident_assignments\n             WHERE incident_id = incidents.id AND status = 'active'\n             LIMIT 1) AS \"assignee_id?\"\n        \"#,\n        incident_id,\n        new_status,\n        new_severity,\n    )\n    .fetch_one(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub async fn update_incident_severity(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    new_severity: \u0026str,\n) -\u003e Result\u003cIncidentRow, AppError\u003e {\n    let row = sqlx::query_as!(\n        IncidentRow,\n        r#\"\n        UPDATE incidents\n        SET severity   = $2,\n            updated_at = now()\n        WHERE id = $1\n        RETURNING\n            id, team_id, title, body, severity, status, created_by,\n            created_at, updated_at, acknowledged_at, escalated_at, resolved_at,\n            (SELECT user_id FROM incident_assignments\n             WHERE incident_id = incidents.id AND status = 'active'\n             LIMIT 1) AS \"assignee_id?\"\n        \"#,\n        incident_id,\n        new_severity,\n    )\n    .fetch_one(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub async fn insert_system_timeline_entry(\n    pool: \u0026PgPool,\n    id: Uuid,\n    incident_id: Uuid,\n    author_id: Uuid,\n    content: \u0026str,\n) -\u003e Result\u003c(), AppError\u003e {\n    sqlx::query!(\n        r#\"\n        INSERT INTO timeline_entries (id, incident_id, author_id, kind, content, created_at)\n        VALUES ($1, $2, $3, 'system', $4, now())\n        \"#,\n        id,\n        incident_id,\n        author_id,\n        content,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(())\n}\n\npub async fn deactivate_current_assignee(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE incident_assignments\n        SET status        = 'replaced',\n            unassigned_at = now()\n        WHERE incident_id = $1\n          AND status      = 'active'\n        \"#,\n        incident_id,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn insert_assignment(\n    pool: \u0026PgPool,\n    id: Uuid,\n    incident_id: Uuid,\n    user_id: Uuid,\n    assigned_by: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    sqlx::query!(\n        r#\"\n        INSERT INTO incident_assignments\n            (id, incident_id, user_id, assigned_by, status, assigned_at)\n        VALUES ($1, $2, $3, $4, 'active', now())\n        \"#,\n        id,\n        incident_id,\n        user_id,\n        assigned_by,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(())\n}\n\npub async fn insert_timeline_entry(\n    pool: \u0026PgPool,\n    id: Uuid,\n    incident_id: Uuid,\n    author_id: Uuid,\n    content: \u0026str,\n) -\u003e Result\u003c(), AppError\u003e {\n    sqlx::query!(\n        r#\"\n        INSERT INTO timeline_entries\n            (id, incident_id, author_id, kind, content, created_at)\n        VALUES ($1, $2, $3, 'message', $4, now())\n        \"#,\n        id,\n        incident_id,\n        author_id,\n        content,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(())\n}\n\npub struct TimelineEntryRow {\n    pub id: Uuid,\n    pub incident_id: Uuid,\n    pub author_id: Uuid,\n    pub kind: String,\n    pub content: String,\n    pub created_at: DateTime\u003cUtc\u003e,\n    pub edited_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n}\n\npub async fn list_timeline_entries(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    before: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    limit: i64,\n) -\u003e Result\u003cVec\u003cTimelineEntryRow\u003e, AppError\u003e {\n    let rows = sqlx::query_as!(\n        TimelineEntryRow,\n        r#\"\n        SELECT id, incident_id, author_id, kind, content, created_at, edited_at\n        FROM timeline_entries\n        WHERE incident_id = $1\n          AND ($2::timestamptz IS NULL OR created_at \u003c $2)\n        ORDER BY created_at ASC\n        LIMIT $3\n        \"#,\n        incident_id,\n        before,\n        limit,\n    )\n    .fetch_all(pool)\n    .await?;\n\n    Ok(rows)\n}\n\npub async fn find_timeline_entry(\n    pool: \u0026PgPool,\n    entry_id: Uuid,\n) -\u003e Result\u003cOption\u003cTimelineEntryRow\u003e, AppError\u003e {\n    let row = sqlx::query_as!(\n        TimelineEntryRow,\n        r#\"\n        SELECT id, incident_id, author_id, kind, content, created_at, edited_at\n        FROM timeline_entries\n        WHERE id = $1\n        \"#,\n        entry_id,\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub async fn update_timeline_entry_content(\n    pool: \u0026PgPool,\n    entry_id: Uuid,\n    new_content: \u0026str,\n) -\u003e Result\u003cTimelineEntryRow, AppError\u003e {\n    let row = sqlx::query_as!(\n        TimelineEntryRow,\n PgPool;\nuse uuid::Uuid;\n\nuse crate::domain::releases::{ReleaseRow, ReleaseStepRow};\n\npub async fn create_release(\n    pool: \u0026PgPool,\n    id: Uuid,\n    team_id: Uuid,\n    title: \u0026str,\n    body: \u0026str,\n    created_by: Uuid,\n    step_names: \u0026[String],\n) -\u003e sqlx::Result\u003cReleaseRow\u003e {\n    let mut tx = pool.begin().await?;\n\n    let row = sqlx::query_as::\u003c_, ReleaseRow\u003e(\n        r#\"\n        INSERT INTO releases (id, team_id, title, body, created_by)\n        VALUES ($1, $2, $3, $4, $5)\n        RETURNING *\n        \"#,\n    )\n    .bind(id)\n    .bind(team_id)\n    .bind(title)\n    .bind(body)\n    .bind(created_by)\n    .fetch_one(\u0026mut *tx)\n    .await?;\n\n    for (i, name) in step_names.iter().enumerate() {\n        let step_id = Uuid::new_v4();\n        let position = (i + 1) as i32;\n\n        sqlx::query(\n            r#\"\n            INSERT INTO release_steps (id, release_id, name, position)\n            VALUES ($1, $2, $3, $4)\n            \"#,\n        )\n        .bind(step_id)\n        .bind(id)\n        .bind(name)\n        .bind(position)\n        .execute(\u0026mut *tx)\n        .await?;\n    }\n\n    tx.commit().await?;\n\n    Ok(row)\n}\n\npub async fn list_releases(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    status_filter: Option\u003c\u0026str\u003e,\n) -\u003e sqlx::Result\u003cVec\u003cReleaseRow\u003e\u003e {\n    match status_filter {\n        Some(status) =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                SELECT * FROM releases\n                WHERE team_id = $1 AND status = $2\n                ORDER BY created_at DESC\n                \"#,\n            )\n            .bind(team_id)\n            .bind(status)\n            .fetch_all(pool)\n            .await\n        }\n        None =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                SELECT * FROM releases\n                WHERE team_id = $1\n                ORDER BY created_at DESC\n                \"#,\n            )\n            .bind(team_id)\n            .fetch_all(pool)\n            .await\n        }\n    }\n}\n\npub async fn get_release_by_id(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n) -\u003e sqlx::Result\u003cOption\u003cReleaseRow\u003e\u003e {\n    sqlx::query_as::\u003c_, ReleaseRow\u003e(\n        r#\"\n        SELECT * FROM releases WHERE id = $1\n        \"#,\n    )\n    .bind(release_id)\n    .fetch_optional(pool)\n    .await\n}\n\npub async fn get_steps_for_release(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n) -\u003e sqlx::Result\u003cVec\u003cReleaseStepRow\u003e\u003e {\n    sqlx::query_as::\u003c_, ReleaseStepRow\u003e(\n        r#\"\n        SELECT * FROM release_steps\n        WHERE release_id = $1\n        ORDER BY position ASC\n        \"#,\n    )\n    .bind(release_id)\n    .fetch_all(pool)\n    .await\n}\n\npub async fn get_steps_for_releases(\n    pool: \u0026PgPool,\n    release_ids: \u0026[Uuid],\n) -\u003e sqlx::Result\u003cVec\u003cReleaseStepRow\u003e\u003e {\n    if release_ids.is_empty() {\n        return Ok(vec![]);\n    }\n\n    sqlx::query_as::\u003c_, ReleaseStepRow\u003e(\n        r#\"\n        SELECT * FROM release_steps\n        WHERE release_id = ANY($1)\n        ORDER BY release_id, position ASC\n        \"#,\n    )\n    .bind(release_ids)\n    .fetch_all(pool)\n    .await\n}\n\npub async fn update_release_status(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    new_status: \u0026str,\n) -\u003e sqlx::Result\u003cReleaseRow\u003e {\n    let row = match new_status {\n        \"in_progress\" =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                UPDATE releases\n                SET status = $2, started_at = now(), updated_at = now()\n                WHERE id = $1\n                RETURNING *\n                \"#,\n            )\n            .bind(release_id)\n            .bind(new_status)\n            .fetch_one(pool)\n            .await?\n        }\n        \"completed\" =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                UPDATE releases\n                SET status = $2, completed_at = now(), updated_at = now()\n                WHERE id = $1\n                RETURNING *\n                \"#,\n            )\n            .bind(release_id)\n            .bind(new_status)\n            .fetch_one(pool)\n            .await?\n        }\n        \"cancelled\" =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                UPDATE releases\n                SET status = $2, cancelled_at = now(), updated_at = now()\n                WHERE id = $1\n                RETURNING *\n                \"#,\n            )\n            .bind(release_id)\n            .bind(new_status)\n            .fetch_one(pool)\n            .await?\n        }\n        _ =\u003e {\n            sqlx::query_as::\u003c_, ReleaseRow\u003e(\n                r#\"\n                UPDATE releases\n                SET status = $2, updated_at = now()\n                WHERE id = $1\n                RETURNING *\n                \"#,\n            )\n            .bind(release_id)\n            .bind(new_status)\n            .fetch_one(pool)\n            .await?\n        }\n    };\n\n    Ok(row)\n}\n\npub async fn get_step_by_id(pool: \u0026PgPool, step_id: Uuid) -\u003e sqlx::Result\u003cOption\u003cReleaseStepRow\u003e\u003e {\n    sqlx::query_as::\u003c_, ReleaseStepRow\u003e(r#\"SELECT * FROM release_steps WHERE id = $1\"#)\n        .bind(step_id)\n        .fetch_optional(pool)\n        .await\n}\n\npub async fn validate_step(\n    pool: \u0026PgPool,\n    step_id: Uuid,\n    validated_by: Uuid,\n) -\u003e sqlx::Result\u003cReleaseStepRow\u003e {\n    sqlx::query_as::\u003c_, ReleaseStepRow\u003e(\n        r#\"\n        UPDATE release_steps\n        SET validated_by = $2, validated_at = now()\n        WHERE id = $1\n        RETURNING *\n        \"#,\n    )\n    .bind(step_id)\n    .bind(validated_by)\n    .fetch_one(pool)\n    .await\n}\n\npub async fn create_incident_link(\n    pool: \u0026PgPool,\n    id: Uuid,\n    release_id: Uuid,\n    incident_id: Uuid,\n    linked_by: Uuid,\n) -\u003e sqlx::Result\u003c()\u003e {\n    sqlx::query(\n        r#\"\n        INSERT INTO release_incident_links (id, release_id, incident_id, linked_by)\n        VALUES ($1, $2, $3, $4)\n        \"#,\n    )\n    .bind(id)\n    .bind(release_id)\n    .bind(incident_id)\n    .bind(linked_by)\n    .execute(pool)\n    .await?;\n\n    Ok(())\n}\n\npub async fn remove_incident_link(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    incident_id: Uuid,\n) -\u003e sqlx::Result\u003cbool\u003e {\n    let result = sqlx::query(\n        r#\"\n        UPDATE release_incident_links\n        SET status = 'removed'\n        WHERE release_id = $1 AND incident_id = $2 AND status = 'active'\n        \"#,\n    )\n    .bind(release_id)\n    .bind(incident_id)\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn has_active_link(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n    incident_id: Uuid,\n) -\u003e sqlx::Result\u003cbool\u003e {\n    let row = sqlx::query_scalar::\u003c_, i64\u003e(\n        r#\"\n        SELECT COUNT(*) FROM release_incident_links\n        WHERE release_id = $1 AND incident_id = $2 AND status = 'active'\n        \"#,\n    )\n    .bind(release_id)\n    .bind(incident_id)\n    .fetch_one(pool)\n    .await?;\n\n    Ok(row \u003e 0)\n}\n\npub async fn count_active_unresolved_links(pool: \u0026PgPool, release_id: Uuid) -\u003e sqlx::Result\u003ci64\u003e {\n    let count = sqlx::query_scalar::\u003c_, i64\u003e(\n        r#\"\n        SELECT COUNT(*)\n        FROM release_incident_links ril\n        JOIN incidents i ON i.id = ril.incident_id\n        WHERE ril.release_id = $1\n          AND ril.status = 'active'\n          AND i.status != 'resolved'\n        \"#,\n    )\n    .bind(release_id)\n    .fetch_one(pool)\n    .await?;\n\n    Ok(count)\n}\n\npub async fn get_blocked_releases_for_incident(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n) -\u003e sqlx::Result\u003cVec\u003cReleaseRow\u003e\u003e {\n    sqlx::query_as::\u003c_, ReleaseRow\u003e(\n        r#\"\n        SELECT DISTINCT r.*\n        FROM releases r\n        JOIN release_incident_links ril ON ril.release_id = r.id\n        WHERE ril.incident_id = $1\n          AND ril.status = 'active'\n          AND r.status = 'blocked'\n        \"#,\n    )\n    .bind(incident_id)\n    .fetch_all(pool)\n    .await\n}\n\n#[derive(Debug, sqlx::FromRow)]\npub struct LinkedIncidentRow {\n    pub id: Uuid,\n    pub title: String,\n    pub status: String,\n    pub severity: String,\n}\n\npub async fn get_linked_incidents(\n    pool: \u0026PgPool,\n    release_id: Uuid,\n) -\u003e sqlx::Result\u003cVec\u003cLinkedIncidentRow\u003e\u003e {\n    sqlx::query_as::\u003c_, LinkedIncidentRow\u003e(\n        r#\"\n        SELECT i.id, i.title, i.status, i.severity\n        FROM incidents i\n        JOIN release_incident_links ril ON ril.incident_id = i.id\n        WHERE ril.release_id = $1 AND ril.status = 'active'\n        ORDER BY ril.linked_at DESC\n        \"#,\n    )\n    .bind(release_id)\n    .fetch_all(pool)\n    .await\n}\n","traces":[{"line":6,"address":[16159392],"length":1,"stats":{"Line":0}},{"line":15,"address":[13952436],"length":1,"stats":{"Line":0}},{"line":24,"address":[13183509],"length":1,"stats":{"Line":0}},{"line":25,"address":[13183560],"length":1,"stats":{"Line":0}},{"line":26,"address":[13183611],"length":1,"stats":{"Line":0}},{"line":27,"address":[13183650],"length":1,"stats":{"Line":0}},{"line":28,"address":[13183689],"length":1,"stats":{"Line":0}},{"line":29,"address":[13183847,13183748,13183466,13183996,13183774],"length":1,"stats":{"Line":0}},{"line":30,"address":[13184254,13184364,13183878,13182625,13183974,1318 onWithToken, ServiceName,\n};\n\npub async fn upsert_connection(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n    service: ServiceName,\n    encrypted_token: \u0026[u8],\n) -\u003e Result\u003cServiceConnection, sqlx::Error\u003e {\n    let row = sqlx::query!(\n        r#\"\n        INSERT INTO service_connections (id, user_id, service, encrypted_token)\n        VALUES ($1, $2, $3, $4)\n        ON CONFLICT (user_id, service) DO UPDATE\n            SET encrypted_token = EXCLUDED.encrypted_token,\n                updated_at = now()\n        RETURNING id, service, created_at, updated_at\n        \"#,\n        Uuid::new_v4(),\n        user_id,\n        service.as_str(),\n        encrypted_token,\n    )\n    .fetch_one(pool)\n    .await?;\n\n    let service = ServiceName::from_db(\u0026row.service).ok_or_else(|| {\n        sqlx::Error::Decode(format!(\"Unknown service in DB: {}\", row.service).into())\n    })?;\n\n    Ok(ServiceConnection {\n        id: row.id,\n        service,\n        created_at: row.created_at.timestamp(),\n        updated_at: row.updated_at.timestamp(),\n    })\n}\n\npub async fn list_by_user(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n) -\u003e Result\u003cVec\u003cServiceConnection\u003e, sqlx::Error\u003e {\n    let rows = sqlx::query!(\n        r#\"\n        SELECT id, service, created_at, updated_at\n        FROM service_connections\n        WHERE user_id = $1\n        ORDER BY service ASC\n        \"#,\n        user_id,\n    )\n    .fetch_all(pool)\n    .await?;\n\n    let mut connections = Vec::with_capacity(rows.len());\n    for row in rows {\n        let service = ServiceName::from_db(\u0026row.service).ok_or_else(|| {\n            sqlx::Error::Decode(format!(\"Unknown service in DB: {}\", row.service).into())\n        })?;\n        connections.push(ServiceConnection {\n            id: row.id,\n            service,\n            created_at: row.created_at.timestamp(),\n            updated_at: row.updated_at.timestamp(),\n        });\n    }\n\n    Ok(connections)\n}\n\npub async fn find_with_token(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n    service: ServiceName,\n) -\u003e Result\u003cOption\u003cServiceConnectionWithToken\u003e, sqlx::Error\u003e {\n    let row = sqlx::query!(\n        r#\"\n        SELECT id, user_id, service, encrypted_token, created_at, updated_at\n        FROM service_connections\n        WHERE user_id = $1 AND service = $2\n        \"#,\n        user_id,\n        service.as_str(),\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    let Some(row) = row else {\n        return Ok(None);\n    };\n\n    let service = ServiceName::from_db(\u0026row.service).ok_or_else(|| {\n        sqlx::Error::Decode(format!(\"Unknown service in DB: {}\", row.service).into())\n    })?;\n\n    Ok(Some(ServiceConnectionWithToken {\n        id: row.id,\n        user_id: row.user_id,\n        service,\n        encrypted_token: row.encrypted_token,\n        created_at: row.created_at,\n        updated_at: row.updated_at,\n    }))\n}\n\npub async fn delete_connection(\n    pool: \u0026PgPool,\n    user_id: Uuid,\n    service: ServiceName,\n) -\u003e Result\u003cbool, sqlx::Error\u003e {\n    let result = sqlx::query!(\n        r#\"DELETE FROM service_connections WHERE user_id = $1 AND service = $2\"#,\n        user_id,\n        service.as_str(),\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n","traces":[{"line":8,"address":[14620160],"length":1,"stats":{"Line":0}},{"line":14,"address":[15261451,15260937,15259879,15260809,15259922,15259989,15261200,15262251,15260983,15259770,15261275],"length":1,"stats":{"Line":0}},{"line":23,"address":[15259642],"length":1,"stats":{"Line":0}},{"line":25,"address":[15259801],"length":1,"stats":{"Line":0}},{"line":28,"address":[15260899],"length":1,"stats":{"Line":0}},{"line":29,"address":[13803913],"length":1,"stats":{"Line":0}},{"line":31,"address":[15261888,15261668,15261735,15262528],"length":1,"stats":{"Line":0}},{"li uid,\n    pub role: String,\n}\n\npub async fn insert_team(\n    conn: \u0026mut PgConnection,\n    id: Uuid,\n    name: \u0026str,\n    created_by: Uuid,\n) -\u003e Result\u003cDateTime\u003cUtc\u003e, AppError\u003e {\n    let row = sqlx::query!(\n        r#\"\n        INSERT INTO teams (id, name, created_by)\n        VALUES ($1, $2, $3)\n        RETURNING created_at\n        \"#,\n        id,\n        name,\n        created_by,\n    )\n    .fetch_one(conn)\n    .await?;\n\n    Ok(row.created_at)\n}\n\npub async fn insert_team_member(\n    conn: \u0026mut PgConnection,\n    id: Uuid,\n    team_id: Uuid,\n    user_id: Uuid,\n    role: Role,\n) -\u003e Result\u003c(), AppError\u003e {\n    sqlx::query!(\n        r#\"\n        INSERT INTO team_members (id, team_id, user_id, role)\n        VALUES ($1, $2, $3, $4)\n        \"#,\n        id,\n        team_id,\n        user_id,\n        role.as_str(),\n    )\n    .execute(conn)\n    .await?;\n\n    Ok(())\n}\n\npub async fn list_teams_for_user(pool: \u0026PgPool, user_id: Uuid) -\u003e Result\u003cVec\u003cTeamView\u003e, AppError\u003e {\n    let rows = sqlx::query!(\n        r#\"\n        SELECT t.id AS \"id!\", t.name AS \"name!\",\n               t.created_at AS \"created_at!\", tm.role AS \"role!\"\n        FROM teams t\n        JOIN team_members tm ON tm.team_id = t.id\n        WHERE tm.user_id = $1\n          AND tm.status = 'active'\n        ORDER BY t.created_at\n        \"#,\n        user_id,\n    )\n    .fetch_all(pool)\n    .await?;\n\n    rows.into_iter()\n        .map(|r| {\n            let role = Role::from_db(\u0026r.role)\n                .ok_or_else(|| AppError::Internal(format!(\"unknown role in db: {}\", r.role)))?;\n            Ok(TeamView {\n                id: r.id,\n                name: r.name,\n                created_at: r.created_at,\n                role,\n            })\n        })\n        .collect()\n}\n\npub async fn find_team_for_member(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n) -\u003e Result\u003cOption\u003cTeamView\u003e, AppError\u003e {\n    let row = sqlx::query!(\n        r#\"\n        SELECT t.id AS \"id!\", t.name AS \"name!\",\n               t.created_at AS \"created_at!\", tm.role AS \"role!\"\n        FROM teams t\n        JOIN team_members tm ON tm.team_id = t.id\n        WHERE t.id = $1\n          AND tm.user_id = $2\n          AND tm.status = 'active'\n        \"#,\n        team_id,\n        user_id,\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    row.map(|r| {\n        let role = Role::from_db(\u0026r.role)\n            .ok_or_else(|| AppError::Internal(format!(\"unknown role in db: {}\", r.role)))?;\n        Ok(TeamView {\n            id: r.id,\n            name: r.name,\n            created_at: r.created_at,\n            role,\n        })\n    })\n    .transpose()\n}\n\npub async fn find_membership(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n) -\u003e Result\u003cOption\u003cMembershipRow\u003e, AppError\u003e {\n    let row = sqlx::query_as!(\n        MembershipRow,\n        r#\"\n        SELECT team_id, user_id, role\n        FROM team_members\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub async fn find_team_by_id(pool: \u0026PgPool, team_id: Uuid) -\u003e Result\u003cOption\u003cTeamRow\u003e, AppError\u003e {\n    let row = sqlx::query_as!(\n        TeamRow,\n        r#\"\n        SELECT id, name, created_at\n        FROM teams\n        WHERE id = $1\n        \"#,\n        team_id,\n    )\n    .fetch_optional(pool)\n    .await?;\n\n    Ok(row)\n}\n\npub struct TeamRow {\n    pub id: Uuid,\n    pub name: String,\n    pub created_at: DateTime\u003cUtc\u003e,\n}\n\npub struct MemberRow {\n    pub user_id: Uuid,\n    pub display_name: String,\n    pub email: String,\n    pub role: String,\n    pub joined_at: DateTime\u003cUtc\u003e,\n}\n\npub async fn list_team_members(pool: \u0026PgPool, team_id: Uuid) -\u003e Result\u003cVec\u003cMemberRow\u003e, AppError\u003e {\n    let rows = sqlx::query_as!(\n        MemberRow,\n        r#\"\n        SELECT u.id AS \"user_id!\",\n               u.display_name AS \"display_name!\",\n               u.email AS \"email!\",\n               tm.role AS \"role!\",\n               tm.joined_at AS \"joined_at!\"\n        FROM team_members tm\n        JOIN users u ON u.id = tm.user_id\n        WHERE tm.team_id = $1\n          AND tm.status = 'active'\n        ORDER BY tm.joined_at\n        \"#,\n        team_id,\n    )\n    .fetch_all(pool)\n    .await?;\n\n    Ok(rows)\n}\n\npub async fn update_member_role(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n    new_role: \u0026str,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE team_members\n        SET role = $3\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n        new_role,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn update_member_role_tx(\n    conn: \u0026mut PgConnection,\n    team_id: Uuid,\n    user_id: Uuid,\n    new_role: \u0026str,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE team_members\n        SET role = $3\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n        new_role,\n    )\n    .execute(conn)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn deactivate_member(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE team_members\n        SET status = 'kicked'\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn deactivate_member_tx(\n    conn: \u0026mut PgConnection,\n    team_id: Uuid,\n    user_id: Uuid,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE team_members\n        SET status = 'kicked'\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n    )\n    .execute(conn)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n\npub async fn insert_ban(\n    conn: \u0026mut PgConnection,\n    id: Uuid,\n    team_id: Uuid,\n    user_id: Uuid,\n    created_by: Uuid,\n    reason: Option\u003c\u0026str\u003e,\n    expires_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n) -\u003e Result\u003c(), AppError\u003e {\n    sqlx::query!(\n        r#\"\n        INSERT INTO team_bans (id, team_id, user_id, created_by, reason, expires_at)\n        VALUES ($1, $2, $3, $4, $5, $6)\n        \"#,\n        id,\n        team_id,\n        user_id,\n        created_by,\n        reason,\n        expires_at,\n    )\n    .execute(conn)\n    .await?;\n\n    Ok(())\n}\n\npub async fn lift_active_ban(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    user_id: Uuid,\n) -\u003e Result\u003cbool, AppError\u003e {\n    let result = sqlx::query!(\n        r#\"\n        UPDATE team_bans\n        SET status = 'lifted'\n        WHERE team_id = $1\n          AND user_id = $2\n          AND status = 'active'\n        \"#,\n        team_id,\n        user_id,\n    )\n    .execute(pool)\n    .await?;\n\n    Ok(result.rows_affected() \u003e 0)\n}\n","traces":[{"line":14,"address":[15719648],"length":1,"stats":{"Line":0}},{"line":20,"address":[13118339,13118548,13117572,13117636,13119229,13118505,13117490,13118809,13118969,131 es","about.rs"],"content":"use std::collections::BTreeMap;\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse crate::domain::service_connections::ServiceName;\nuse crate::hooks::{ActionCatalog, ReactionRegistry};\nuse serde::Serialize;\n\n#[derive(Debug, Serialize)]\npub struct AboutResponse {\n    pub client: ClientInfo,\n    pub server: ServerInfo,\n}\n\n#[derive(Debug, Serialize)]\npub struct ClientInfo {\n    pub host: String,\n}\n\n#[derive(Debug, Serialize)]\npub struct ServerInfo {\n    pub current_time: i64,\n    pub services: Vec\u003cServiceCatalog\u003e,\n    pub token: String,\n}\n\n#[derive(Debug, Serialize)]\npub struct ServiceCatalog {\n    pub name: String,\n    pub connectable: bool,\n    pub actions: Vec\u003cCatalogEntry\u003e,\n    pub reactions: Vec\u003cCatalogEntry\u003e,\n}\n\n#[derive(Debug, Serialize)]\npub struct CatalogEntry {\n    pub name: String,\n    pub description: String,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub payload_example: Option\u003cString\u003e,\n}\n\npub fn build_response(\n    client_host: String,\n    catalog: \u0026ActionCatalog,\n    registry: \u0026ReactionRegistry,\n    kickoff_token: String,\n) -\u003e AboutResponse {\n    let services = group_by_service(catalog, registry);\n\n    AboutResponse {\n        client: ClientInfo { host: client_host },\n        server: ServerInfo {\n            current_time: current_unix_time(),\n            services,\n            token: kickoff_token,\n        },\n    }\n}\n\nfn group_by_service(catalog: \u0026ActionCatalog, registry: \u0026ReactionRegistry) -\u003e Vec\u003cServiceCatalog\u003e {\n    let mut services: BTreeMap\u003cString, ServiceCatalog\u003e = BTreeMap::new();\n\n    for action in catalog.all() {\n        services\n            .entry(action.service.clone())\n            .or_insert_with(|| new_service(\u0026action.service))\n            .actions\n            .push(CatalogEntry {\n                name: action.event.clone(),\n                description: action.description.clone(),\n                payload_example: None,\n            });\n    }\n\n    for reaction in registry.all() {\n        services\n            .entry(reaction.service_name().to_string())\n            .or_insert_with(|| new_service(reaction.service_name()))\n            .reactions\n            .push(CatalogEntry {\n                name: reaction.kind().to_string(),\n                description: reaction.description().to_string(),\n                payload_example: Some(reaction.payload_example().to_string()),\n            });\n    }\n\n    services.into_values().collect()\n}\n\nfn new_service(name: \u0026str) -\u003e ServiceCatalog {\n    ServiceCatalog {\n        name: name.to_string(),\n        connectable: ServiceName::from_db(name).is_some(),\n        actions: Vec::new(),\n        reactions: Vec::new(),\n    }\n}\n\nfn current_unix_time() -\u003e i64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .map(|d| d.as_secs() as i64)\n        .unwrap_or(0)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::hooks::ReactionRegistry;\n\n    #[test]\n    fn empty_catalog_and_registry_produce_no_services() {\n        let catalog = ActionCatalog::builder().build();\n        let registry = ReactionRegistry::builder().build();\n\n        let response = build_response(\n            \"127.0.0.1\".to_string(),\n            \u0026catalog,\n            \u0026registry,\n            \"token123\".to_string(),\n        );\n\n        assert!(response.server.services.is_empty());\n        assert_eq!(response.client.host, \"127.0.0.1\");\n        assert_eq!(response.server.token, \"token123\");\n    }\n\n    #[test]\n    fn actions_are_grouped_by_service() {\n        let catalog = ActionCatalog::builder()\n            .register(\"github\", \"workflow_run\", \"CI finished\")\n            .register(\"github\", \"push\", \"Commits pushed\")\n            .register(\"gitlab\", \"pipeline\", \"Pipeline finished\")\n            .build();\n        let registry = ReactionRegistry::builder().build();\n\n        let response = build_response(\"10.0.0.1\".to_string(), \u0026catalog, \u0026registry, \"t\".to_string());\n\n        assert_eq!(response.server.services.len(), 2);\n        assert_eq!(response.server.services[0].name, \"github\");\n        assert_eq!(response.server.services[0].actions.len(), 2);\n        assert_eq!(response.server.services[1].name, \"gitlab\");\n        assert_eq!(response.server.services[1].actions.len(), 1);\n    }\n\n    #[test]\n    fn current_time_is_populated() {\n        let catalog = ActionCatalog::builder().build();\n        let registry = ReactionRegistry::builder().build();\n\n        let response = build_response(\n            \"127.0.0.1\".to_string(),\n            \u0026catalog,\n            \u0026registry,\n            \"t\".to_string(),\n        );\n\n        assert!(response.server.current_time \u003e 0);\n    }\n\n    #[test]\n    fn connectable_reflects_service_name_enum() {\n        let catalog = ActionCatalog::builder()\n            .register(\"github\", \"workflow_run\", \"CI finished\")\n            .build();\n        let registry = ReactionRegistry::builder().build();\n\n        let response = build_response(\n            \"127.0.0.1\".to_string(),\n            \u0026catalog,\n            \u0026registry,\n            \"t\".to_string(),\n        );\n        assert!(response.server.services[0].connectable);\n    }\n}\n","traces":[{"line":42,"address":[13604576,13605071,13605102],"length":1,"stats":{"Line":1}},{"line":48,"address":[13604645],"length":1,"stats":{"Line":2}},{"line":51,"address":[13604719],"length":1,"stats":{"Line":2}},{"line":52,"address":[13604906],"length":1,"stats":{"Line":2}},{"line":60,"address":[13606413,13606735,13605136],"length":1,"stats":{"Line":3}},{"line":61,"address":[13605191],"length":1,"stats":{"Line":4}},{"line":63,"address":[13605228,13605308],"length":1,"stats":{"Line":8}},{"line":64,"address":[13606491,13606730]," l: \u0026PgPool,\n    email: \u0026str,\n    password: \u0026str,\n    display_name: \u0026str,\n) -\u003e Result\u003cUser, AppError\u003e {\n    user::validate_signup(email, password, display_name).map_err(AppError::Validation)?;\n\n    let email = normalize_email(email);\n    let display_name = display_name.trim();\n\n    let password_hash = hash_password(password)?;\n\n    match repo::user::insert_user(pool, \u0026email, \u0026password_hash, display_name).await {\n        Ok(user) =\u003e Ok(user),\n        Err(sqlx::Error::Database(db)) if db.is_unique_violation() =\u003e {\n            Err(AppError::Conflict(\"email already in use\".to_string()))\n        }\n        Err(e) =\u003e {\n            tracing::error!(error = ?e, \"insert_user failed\");\n            Err(e.into())\n        }\n    }\n}\n\nfn hash_password(password: \u0026str) -\u003e Result\u003cString, AppError\u003e {\n    use argon2::Argon2;\n    use argon2::password_hash::{PasswordHasher, SaltString, rand_core::OsRng};\n\n    let salt = SaltString::generate(\u0026mut OsRng);\n    Argon2::default()\n        .hash_password(password.as_bytes(), \u0026salt)\n        .map(|hash| hash.to_string())\n        .map_err(|_| AppError::Internal(\"password hashing failed\".to_string()))\n}\n\npub async fn signin(\n    pool: \u0026PgPool,\n    email: \u0026str,\n    password: \u0026str,\n) -\u003e Result\u003c(String, User), AppError\u003e {\n    let email = normalize_email(email);\n\n    let user = repo::user::find_by_email(pool, \u0026email)\n        .await?\n        .ok_or(AppError::Unauthorized(\"invalid credentials\".to_string()))?;\n\n    verify_password(password, \u0026user.password_hash)?;\n\n    let mut raw_token = [0u8; 32];\n    rand::rng().fill_bytes(\u0026mut raw_token);\n    let token_hex = hex::encode(raw_token);\n\n    let token_hash = Sha256::digest(raw_token).to_vec();\n\n    let expires_at = Utc::now() + Duration::days(30);\n    repo::session::insert_session(pool, user.id, \u0026token_hash, ex n\u003ci64\u003e,\n    pub resolved_at: Option\u003ci64\u003e,\n    pub assignee_id: Option\u003cUuid\u003e,\n}\n\nimpl IncidentResponse {\n    fn from_row(row: repo::incidents::IncidentRow) -\u003e Self {\n        Self {\n            id: row.id,\n            team_id: row.team_id,\n            title: row.title,\n            body: row.body,\n            severity: row.severity,\n            status: row.status,\n            created_by: row.created_by,\n            created_at: row.created_at.timestamp(),\n            updated_at: row.updated_at.timestamp(),\n            acknowledged_at: row.acknowledged_at.map(|t| t.timestamp()),\n            escalated_at: row.escalated_at.map(|t| t.timestamp()),\n            resolved_at: row.resolved_at.map(|t| t.timestamp()),\n            assignee_id: row.assignee_id,\n        }\n    }\n}\n\npub struct CreateIncidentInput {\n    pub title: String,\n    pub body: String,\n    pub severity: String,\n}\n\npub struct ListIncidentsInput {\n    pub team_id: Uuid,\n    pub status_filter: Option\u003cString\u003e,\n    pub severity_filter: Option\u003cString\u003e,\n}\n\npub async fn create_incident(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    team_id: Uuid,\n    created_by: Uuid,\n    input: CreateIncidentInput,\n) -\u003e Result\u003cIncidentResponse, AppError\u003e {\n    IncidentSeverity::try_from(input.severity.as_str())\n        .map_err(|_| AppError::Validation(format!(\"unknown severity: {}\", input.severity)))?;\n\n    let title = input.title.trim().to_string();\n    if title.is_empty() {\n        return Err(AppError::Validation(\"title cannot be empty\".into()));\n    }\n\n    let id = Uuid::new_v4();\n\n    let row = repo::incidents::create_incident(\n        pool,\n        id,\n        team_id,\n        \u0026title,\n        \u0026input.body,\n        \u0026input.severity,\n        created_by,\n    )\n    .await?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::IncidentStateChanged {\n                team_id,\n                incident_id: id,\n                new_state: \"open\".to_string(),\n                by: created_by,\n            },\n        )\n        .await;\n\n    Ok(IncidentResponse::from_row(row))\n}\n\npub async fn list_incidents(\n    pool: \u0026PgPool,\n    input: ListIncidentsInput,\n) -\u003e Result\u003cVec\u003cIncidentResponse\u003e, AppError\u003e {\n    if let Some(ref s) = input.status_filter {\n        IncidentStatus::try_from(s.as_str())\n            .map_err(|_| AppError::Validation(format!(\"unknown status filter: {s}\")))?;\n    }\n    if let Some(ref s) = input.severity_filter {\n        IncidentSeverity::try_from(s.as_str())\n            .map_err(|_| AppError::Validation(format!(\"unknown severity filter: {s}\")))?;\n    }\n\n    let rows = repo::incidents::list_incidents(\n        pool,\n        input.team_id,\n        input.status_filter.as_deref(),\n        input.severity_filter.as_deref(),\n    )\n    .await?;\n\n    Ok(rows.into_iter().map(IncidentResponse::from_row).collect())\n}\n\npub async fn get_incident(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    team_id: Uuid,\n) -\u003e Result\u003cIncidentResponse, AppError\u003e {\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    Ok(IncidentResponse::from_row(row))\n}\n\npub async fn transition_incident_status(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    incident_id: Uuid,\n    team_id: Uuid,\n    actor_id: Uuid,\n    new_status: String,\n    new_severity: Option\u003cString\u003e,\n) -\u003e Result\u003cIncidentResponse, AppError\u003e {\n    let to = IncidentStatus::try_from(new_status.as_str())\n        .map_err(|_| AppError::Validation(format!(\"unknown status: {new_status}\")))?;\n\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let from = IncidentStatus::try_from(row.status.as_str())\n        .map_err(|e| AppError::Internal(e.to_string()))?;\n\n    if !domain::incidents::can_transition(\u0026from, \u0026to) {\n        return Err(AppError::Validation(format!(\n            \"cannot transition from '{from}' to '{to}'\"\n        )));\n    }\n\n    let severity_to_set = match \u0026new_severity {\n        Some(s) =\u003e {\n            IncidentSeverity::try_from(s.as_str())\n                .map_err(|_| AppError::Validation(format!(\"unknown severity: {s}\")))?;\n            Some(s.as_str())\n        }\n        None =\u003e None,\n    };\n\n    let updated =\n        repo::incidents::update_incident_status(pool, incident_id, \u0026new_status, severity_to_set)\n            .await?;\n\n    let entry_content = match \u0026to {\n        IncidentStatus::Acknowledged =\u003e \"Incident acknowledged\".to_string(),\n        IncidentStatus::Escalated =\u003e {\n            if let Some(ref sev) = new_severity {\n                format!(\"Incident escalated — severity raised to {sev}\")\n            } else {\n                \"Incident escalated\".to_string()\n            }\n        }\n        IncidentStatus::Resolved =\u003e \"Incident resolved\".to_string(),\n        IncidentStatus::Open =\u003e \"Incident reopened\".to_string(),\n    };\n\n    repo::incidents::insert_system_timeline_entry(\n        pool,\n        Uuid::new_v4(),\n        incident_id,\n        actor_id,\n        \u0026entry_content,\n    )\n    .await?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::IncidentStateChanged {\n                team_id,\n                incident_id,\n                new_state: new_status.clone(),\n                by: actor_id,\n            },\n        )\n        .await;\n\n    if to == IncidentStatus::Escalated\n        \u0026\u0026 let Some(ref sev) = new_severity\n    {\n        broadcaster\n            .to_team(\n                team_id,\n                WsEvent::IncidentEscalated {\n                    team_id,\n                    incident_id,\n                    new_severity: sev.clone(),\n                    by: actor_id,\n                },\n            )\n            .await;\n    }\n\n    if to == IncidentStatus::Resolved {\n        crate::services::releases::check_and_unblock_releases_for_incident(\n            pool,\n            broadcaster.clone(),\n            incident_id,\n        )\n        .await?;\n    }\n\n    Ok(IncidentResponse::from_row(updated))\n}\n\npub async fn update_incident_severity(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    team_id: Uuid,\n    new_severity: String,\n) -\u003e Result\u003cIncidentResponse, AppError\u003e {\n    IncidentSeverity::try_from(new_severity.as_str())\n        .map_err(|_| AppError::Validation(format!(\"unknown severity: {new_severity}\")))?;\n\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let updated =\n        repo::incidents::update_incident_severity(pool, incident_id, \u0026new_severity).await?;\n\n    Ok(IncidentResponse::from_row(updated))\n}\n\npub async fn assign_responder(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    incident_id: Uuid,\n    team_id: Uuid,\n    assigned_by: Uuid,\n    target_user_id: Uuid,\n) -\u003e Result\u003c(), AppError\u003e {\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let membership = repo::teams::find_membership(pool, team_id, target_user_id)\n        .await?\n        .ok_or_else(|| AppError::Validation(\"target user is not a member of this team\".into()))?;\n\n    let target_role = Role::from_db(membership.role.as_str())\n        .ok_or_else(|| AppError::Internal(\"invalid role in database\".into()))?;\n\n    if !target_role.has_at_least(Role::Responder) {\n        return Err(AppError::Validation(\n            \"target user must be at least a Responder\".into(),\n        ));\n    }\n\n    repo::incidents::deactivate_current_assignee(pool, incident_id).await?;\n\n    repo::incidents::insert_assignment(\n        pool,\n        Uuid::new_v4(),\n        incident_id,\n        target_user_id,\n        assigned_by,\n    )\n    .await?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::IncidentAssigned {\n                team_id,\n                incident_id,\n                assigned_to: target_user_id,\n                by: assigned_by,\n            },\n        )\n        .await;\n\n    broadcaster.to_user(\n        target_user_id,\n        WsEvent::IncidentAssigned {\n            team_id,\n            incident_id,\n            assigned_to: target_user_id,\n            by: assigned_by,\n        },\n    );\n\n    Ok(())\n}\n\npub const TIMELINE_MAX_LENGTH: usize = 2000;\n\n#[derive(Debug, Serialize)]\npub struct TimelineEntryResponse {\n    pub id: Uuid,\n    pub incident_id: Uuid,\n    pub author_id: Uuid,\n    pub kind: String,\n    pub content: String,\n    pub created_at: i64,\n    pub edited_at: Option\u003ci64\u003e,\n}\n\nimpl TimelineEntryResponse {\n    fn from_row(row: repo::incidents::TimelineEntryRow) -\u003e Self {\n        Self {\n            id: row.id,\n            incident_id: row.incident_id,\n            author_id: row.author_id,\n            kind: row.kind,\n            content: row.content,\n            created_at: row.created_at.timestamp(),\n            edited_at: row.edited_at.map(|t| t.timestamp()),\n        }\n    }\n}\n\npub async fn add_timeline_entry(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    incident_id: Uuid,\n    team_id: Uuid,\n    author_id: Uuid,\n    content: String,\n) -\u003e Result\u003cTimelineEntryResponse, AppError\u003e {\n    if content.len() \u003e TIMELINE_MAX_LENGTH {\n        return Err(AppError::Validation(format!(\n            \"content exceeds {TIMELINE_MAX_LENGTH} characters\"\n        )));\n    }\n    if content.trim().is_empty() {\n        return Err(AppError::Validation(\"content cannot be empty\".into()));\n    }\n\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let id = Uuid::new_v4();\n    repo::incidents::insert_timeline_entry(pool, id, incident_id, author_id, \u0026content).await?;\n\n    let entries = repo::incidents::list_timeline_entries(pool, incident_id, None, 100).await?;\n    let entry = entries\n        .into_iter()\n        .find(|e| e.id == id)\n        .ok_or_else(|| AppError::Internal(\"entry not found after insert\".into()))?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::TimelineEntryAdded {\n                team_id,\n                incident_id,\n                entry_id: id,\n                author_id,\n                content: content.clone(),\n                at: entry.created_at.timestamp(),\n            },\n        )\n        .await;\n\n    Ok(TimelineEntryResponse::from_row(entry))\n}\n\npub async fn get_timeline(\n    pool: \u0026PgPool,\n    incident_id: Uuid,\n    team_id: Uuid,\n    before_ts: Option\u003ci64\u003e,\n    limit: i64,\n) -\u003e Result\u003cVec\u003cTimelineEntryResponse\u003e, AppError\u003e {\n    let row = repo::incidents::find_incident(pool, incident_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"incident not found\".into()))?;\n\n    if row.team_id != team_id {\n        return Err(AppError::NotFound(\"incident not found\".into()));\n    }\n\n    let before = before_ts\n        .map(|ts| chrono::DateTime::from_timestamp(ts, 0).unwrap_or_else(chrono::Utc::now));\n\n    let limit = limit.clamp(1, 100);\n\n    let rows = repo::incidents::list_timeline_entries(pool, incident_id, before, limit).await?;\n\n    Ok(rows\n        .into_iter()\n        .map(TimelineEntryResponse::from_row)\n        .collect())\n}\n\npub async fn edit_timeline_entry(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    entry_id: Uuid,\n    caller_id: Uuid,\n    new_content: String,\n) -\u003e Result\u003cTimelineEntryResponse, AppError\u003e {\n    if new_content.trim().is_empty() {\n        return Err(AppError::Validation(\"content cannot be empty\".into()));\n    }\n    if new_content.len() \u003e TIMELINE_MAX_LENGTH {\n        return Err(AppError::Validation(format!(\n            \"content exceeds {TIMELINE_MAX_LENGTH} characters\"\n        )));\n    }\n\n    let entry = repo::incidents::find_timeline_entry(pool, entry_id)\n        .await?\n        .ok_or_else(|| AppError::NotFound(\"timeline entry not found\".into()))?;\n\n    if entry.kind == \"system\" {\n        return Err(AppError::Validation(\n            \"system entries cannot be edited\".into(),\n        ));\n    }\n\n    if entry.author_id != caller_id {\n        return Err(AppError::Forbidden(\n            \"only the author can edit this entry\".into(),\n        ));\n    }\n\n    let updated =\n        repo::incidents::update_timeline_entry_content(pool, entry_id, \u0026new_content).await?;\n\n    let incident = repo::incidents::find_incident(pool, entry.incident_id)\n        .await?\n        .ok_or_else(|| AppError::Internal(\"parent incident not found\".into()))?;\n\n    broadcaster\n        .to_team(\n            inci r","src","services","invitations.rs"],"content":"use chrono::{Duration, Utc};\nuse sqlx::PgPool;\nuse uuid::Uuid;\n\nuse crate::domain::team::Role;\nuse crate::error::AppError;\nuse crate::repo;\nuse crate::{\n    domain::invitation::generate_invite_code,\n    ws::{Broadcaster, WsEvent},\n};\n\nuse serde::Serialize;\n\n#[derive(Debug, Serialize)]\npub struct InvitationView {\n    pub id: Uuid,\n    pub code: String,\n    pub expires_at: Option\u003cString\u003e,\n    pub max_uses: Option\u003ci32\u003e,\n    pub uses: i32,\n}\n\n#[derive(Debug, Serialize)]\npub struct JoinResult {\n    pub team_id: Uuid,\n    pub team_name: String,\n    pub role: String,\n}\n\npub async fn create_invitation(\n    pool: \u0026PgPool,\n    team_id: Uuid,\n    created_by: Uuid,\n) -\u003e Result\u003cInvitationView, AppError\u003e {\n    let id = Uuid::new_v4();\n    let code = generate_invite_code();\n    let expires_at = Some(Utc::now() + Duration::days(7));\n\n    let mut conn = pool.acquire().await?;\n    let row = repo::invitations::insert_invitation(\n        \u0026mut conn, id, team_id, \u0026code, created_by, expires_at, None,\n    )\n    .await?;\n\n    Ok(InvitationView {\n        id: row.id,\n        code: row.code,\n        expires_at: row.expires_at.map(|t| t.to_rfc3339()),\n        max_uses: row.max_uses,\n        uses: row.uses,\n    })\n}\n\npub async fn join_team(\n    pool: \u0026PgPool,\n    broadcaster: Broadcaster,\n    user_id: Uuid,\n    code: \u0026str,\n) -\u003e Result\u003cJoinResult, AppError\u003e {\n    let invitation = match repo::invitations::find_valid_invitation_by_code(pool, code).await? {\n        Some(inv) =\u003e inv,\n        None =\u003e {\n            let existed = repo::invitations::invitation_code_ever_existed(pool, code).await?;\n            if existed {\n                return Err(AppError::Gone(\"invitation code has expired\".into()));\n            }\n            return Err(AppError::NotFound(\"invitation code not found\".into()));\n        }\n    };\n\n    let team_id = invitation.team_id;\n\n    if repo::invitations::is_user_banned(pool, team_id, user_id).await? {\n        return Err(AppError::Forbidden(\"you are banned from this team\".into()));\n    }\n\n    let mut tx = pool.begin().await?;\n\n    let existing = repo::invitations::find_any_membership(\u0026mut tx, team_id, user_id).await?;\n\n    if let Some(row) = existing {\n        match row.status.as_str() {\n            \"active\" =\u003e {\n                return Err(AppError::Conflict(\"already a member of this team\".into()));\n            }\n            \"kicked\" =\u003e {\n                repo::invitations::reactivate_member(\u0026mut tx, row.id).await?;\n            }\n            other =\u003e {\n                return Err(AppError::Internal(format!(\n                    \"unexpected member status: {other}\"\n                )));\n            }\n        }\n    } else {\n        repo::teams::insert_team_member(\u0026mut tx, Uuid::new_v4(), team_id, user_id, Role::Observer)\n            .await?;\n    }\n\n    repo::invitations::increment_invitation_uses(\u0026mut tx, invitation.id).await?;\n\n    tx.commit().await?;\n\n    let team = repo::teams::find_team_by_id(pool, team_id)\n        .await?\n        .ok_or_else(|| AppError::Internal(\"team not found after join\".into()))?;\n\n    let joiner = sqlx::query_scalar!(\n        r#\"SELECT display_name AS \"display_name!\" FROM users WHERE id = $1\"#,\n        user_id,\n    )\n    .fetch_one(pool)\n    .await?;\n\n    broadcaster\n        .to_team(\n            team_id,\n            WsEvent::MemberJoined {\n                team_id,\n                user_id,\n                display_name: joiner,\n                role: \"observer\".into(),\n            },\n        )\n        .await;\n\n    Ok(JoinResult {\n        team_id,\n        team_name: team.name,\n        role: \"observer\".into(),\n    })\n}\n","traces":[{"line":31,"address":[15721520],"length":1,"stats":{"Line":0}},{"line":36,"addr
