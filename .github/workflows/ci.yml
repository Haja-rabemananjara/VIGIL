name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  server-quality:
    name: "Server: Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint check
        run: cargo clippy -- -D warnings

  client-quality:
    name: "Client: Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

  server-build:
    name: "Server: Build & Test"
    runs-on: ubuntu-latest
    needs: server-quality
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil_test
          POSTGRES_DB: vigil
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://vigil:vigil_test@localhost:5432/vigil
      WEBHOOK_SECRET: test-secret
      MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STUDENT_FIRSTNAME: Test
      STUDENT_LOGIN: test.login

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Run migrations
        run: cargo install sqlx-cli --no-default-features --features postgres && sqlx migrate run

      - name: SQLx cache check
        run: cargo sqlx prepare --check

      - name: Run tests
        run: cargo test -- --test-threads=2

      - name: Build release binary
        run: cargo build --release

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server/target/release/server
          retention-days: 14

  client-build:
    name: "Client: Build & Test"
    runs-on: ubuntu-latest
    needs: client-quality
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 14

  artifacts:
    name: "Artifacts"
    runs-on: ubuntu-latest
    needs: [server-build, client-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: ./artifacts/server/

      - name: Download client coverage
        uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: ./artifacts/client-coverage/

      - name: List artifacts
        run: |
          echo "Server"
          ls -la ./artifacts/server/
          echo "Client Coverage"
          ls -la ./artifacts/client-coverage/