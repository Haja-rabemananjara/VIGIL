name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  server-quality:
    name: "Server: Quality"
    runs-on: ubuntu-latest²

    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            server/target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Lint check
        run: cargo clippy -- -D warnings

  client-quality:
    name: "Client: Quality"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

  server-build:
    name: "Server: Build & Test"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil_dev
          POSTGRES_DB: vigil
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://vigil:vigil_dev@localhost:5432/vigil
      WEBHOOK_SECRET: test-secret
      MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STUDENT_FIRSTNAME: Test
      STUDENT_LOGIN: test.login

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            server/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('server/Cargo.lock') }}-${{ hashFiles('server/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('server/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run

      - name: SQLx cache check
        run: cargo sqlx prepare --check

      - name: Run tests
        run: cargo test -- --test-threads=2
        continue-on-error: true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate server coverage report
        run: cargo llvm-cov --html --output-dir coverage --ignore-run-fail -- --test-threads=2

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

      - name: Build release binary
        run: cargo build --release

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server/target/release/server
          retention-days: 14
          if-no-files-found: warn

  client-build:
    name: "Client: Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 14

      - name: Build static export
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/out/
          retention-days: 14
          if-no-files-found: warn