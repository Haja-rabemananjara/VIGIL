# Usage: docker compose -f docker-compose.dev.yml up -d
# Stop:  docker compose -f docker-compose.dev.yml down
# Reset: docker compose -f docker-compose.dev.yml down -v  (destroys data)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil}"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
