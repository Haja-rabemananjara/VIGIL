server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/teams/[^/]+/incidents/[^/]+/?$ {
        try_files $uri $uri/ /teams/placeholder/incidents/placeholder/index.html;
    }
    location ~ ^/teams/[^/]+/incidents/?$ {
        try_files $uri $uri/ /teams/placeholder/incidents/index.html;
    }
    location ~ ^/teams/[^/]+/releases/[^/]+/?$ {
        try_files $uri $uri/ /teams/placeholder/releases/placeholder/index.html;
    }
    location ~ ^/teams/[^/]+/releases/?$ {
        try_files $uri $uri/ /teams/placeholder/releases/index.html;
    }
    location ~ ^/teams/[^/]+/members/?$ {
        try_files $uri $uri/ /teams/placeholder/members/index.html;
    }
    location ~ ^/teams/[^/]+/rules/?$ {
        try_files $uri $uri/ /teams/placeholder/rules/index.html;
    }
    location ~ ^/teams/[^/]+/audit/?$ {
        try_files $uri $uri/ /teams/placeholder/audit/index.html;
    }
    location ~ ^/teams/[^/]+/integrations/?$ {
        try_files $uri $uri/ /teams/placeholder/integrations/index.html;
    }
    location ~ ^/teams/[^/]+/?$ {
        try_files $uri $uri/ /teams/placeholder/index.html;
    }
    location ~ ^/messages/[^/]+/?$ {
        try_files $uri $uri/ /messages/placeholder/index.html;
    }
    location ~ ^/auth/github/callback/?$ {
        try_files $uri $uri/ /auth/github/callback/index.html;
    }
    

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /client.AppImage {
        alias /usr/share/nginx/html/downloads/client.AppImage;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="client.AppImage"';
    }
}